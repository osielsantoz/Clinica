<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Admin YOD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FCF9F9; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: #D4A3A3; box-shadow: 0 0 0 2px rgba(212, 163, 163, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center h-screen px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-serif text-[#D4A3A3] tracking-wider">YOD</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Painel Administrativo</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" class="form-input pl-10" required placeholder="Digite seu usuário">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-input pl-10" required placeholder="••••••••">
                </div>
            </div>

            <!-- OPÇÃO MANTER CONECTADO -->
            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 text-[#D4A3A3] rounded focus:ring-[#D4A3A3] cursor-pointer">
                    <span class="text-sm text-gray-600">Manter conectado</span>
                </label>
            </div>

            <div id="errorMsg" class="hidden text-sm text-red-500 text-center font-medium bg-red-50 p-2 rounded-lg"></div>

            <button type="submit" id="loginBtn" class="w-full bg-[#D4A3A3] hover:bg-[#C08F8F] text-white py-3 rounded-xl font-medium transition-colors shadow-md">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://jjekkkvezunxquvsyqek.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_mcH9rB1LkliFvxoplIhAdQ_uPl0B0BO';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Se já estiver logado anteriormente via localStorage, pula a tela de login direto
        if (localStorage.getItem('yod_logged') === 'true' || sessionStorage.getItem('yod_logged') === 'true') {
            window.location.href = 'admin.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errDiv = document.getElementById('errorMsg');
            
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const remember = document.getElementById('rememberMe').checked;

            btn.innerText = 'Verificando...';
            btn.disabled = true;
            errDiv.classList.add('hidden');

            try {
                const { data, error } = await supabase
                    .from('admin_users')
                    .select('*')
                    .eq('username', userIn)
                    .maybeSingle();

                if (error || !data || data.password !== passIn) {
                    throw new Error("Usuário ou senha incorretos.");
                }

                // Se "Manter conectado" estiver marcado, salva no localStorage. Senão, salva no sessionStorage.
                if (remember) {
                    localStorage.setItem('yod_logged', 'true');
                } else {
                    sessionStorage.setItem('yod_logged', 'true');
                }

                window.location.href = 'admin.html';

            } catch (err) {
                errDiv.innerText = err.message || "Erro ao fazer login.";
                errDiv.classList.remove('hidden');
                btn.innerText = 'Entrar no Sistema';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
