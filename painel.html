<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel da Clínica - Recepção</title>
    <style>
        :root { --primary-accent: #3b82f6; --sidebar-bg: #0f172a; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px; font-size: 1.25rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px;}
        .sidebar-logo { width: 35px; height: 35px; background: var(--primary-accent); border-radius: 6px; display: flex; justify-content: center; align-items: center; overflow: hidden; font-size: 12px;}
        .sidebar-logo img { width: 100%; height: 100%; object-fit: cover; }
        .nav-menu { padding: 20px 0; }
        .nav-item { padding: 15px 24px; color: #cbd5e1; cursor: pointer; transition: 0.2s; }
        .nav-item.active { background-color: var(--primary-accent); color: #fff; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .view-section { display: none; max-width: 1200px; margin: 0 auto; }
        .view-section.active { display: block; }
        .card-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }
        .btn { background: var(--primary-accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn.danger { background: var(--danger); }
        .agenda-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; }
        .day-col { min-width: 320px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .day-header { padding: 15px; text-align: center; background: #f8fafc; border-bottom: 1px solid var(--border-color); border-radius: 12px 12px 0 0; }
        .day-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .slot { border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; }
        .slot.booked { border-left: 5px solid var(--primary-accent); background: #f0f7ff; }
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .dash-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table th, .table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; padding: 30px; border-radius: 12px; width: 400px; text-align: center; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo" id="ui-logo">CL</div><span id="ui-nome">Clínica</span></div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="switchView('agenda', this)">📅 Agenda</div>
            <div class="nav-item" onclick="switchView('grade', this)">🕒 Configurar Grade</div>
            <div class="nav-item" onclick="switchView('financeiro', this)">💰 Financeiro</div>
        </div>
    </aside>
    <main class="main-content">
        <section id="agenda" class="view-section active">
            <h1>Agenda de Atendimentos</h1>
            <div class="agenda-scroll" id="agenda-container"><p style="padding:40px; color:gray;">Crie a grade horária na aba ao lado para começar.</p></div>
        </section>
        <section id="grade" class="view-section">
            <h1>Configurar Horários</h1>
            <div class="card-container">
                <div class="form-grid">
                    <div><label>Abertura</label><input type="time" id="g-start" value="08:00"></div>
                    <div><label>Fecho</label><input type="time" id="g-end" value="18:00"></div>
                    <div><label>Intervalo</label><select id="g-int"><option value="30">30 min</option><option value="60" selected>60 min</option></select></div>
                </div>
                <button class="btn" onclick="gerarGrade()">⚙️ Gerar Agenda Diária</button>
            </div>
        </section>
        <section id="financeiro" class="view-section">
            <h1>Fluxo de Caixa</h1>
            <div class="dash-grid">
                <div class="dash-card"><h3>Entradas</h3><h2 id="f-in" style="color:var(--success)">0.00€</h2></div>
                <div class="dash-card"><h3>Saídas</h3><h2 id="f-out" style="color:var(--danger)">0.00€</h2></div>
                <div class="dash-card"><h3>Saldo</h3><h2 id="f-total">0.00€</h2></div>
            </div>
            <button class="btn danger" style="width:auto; padding:10px 20px;" onclick="abrirDespesa()">➖ Lançar Despesa</button>
            <table class="table"><thead><tr><th>Data</th><th>Desc</th><th>Tipo</th><th>Valor</th></tr></thead><tbody id="f-table"></tbody></table>
        </section>
    </main>
    <div id="modal-checkout" class="modal-overlay"><div class="modal-box"><h2>Concluir Atendimento</h2><p>Valor recebido (€):</p><input type="number" id="pay-val" style="margin:15px 0;"><div style="display:flex; gap:10px;"><button class="btn" onclick="confirmarCheckout()">Confirmar</button><button class="btn danger" onclick="fecharModais()">Cancelar</button></div></div></div>
    <div id="modal-despesa" class="modal-overlay"><div class="modal-box"><h2>Lançar Despesa</h2><input type="text" id="d-desc" placeholder="Ex: Renda" style="margin-bottom:10px;"><input type="number" id="d-val" placeholder="Valor €"><button class="btn danger" style="margin-top:15px;" onclick="salvarDespesa()">Registar Saída</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = () => { 
            let c = JSON.parse(localStorage.getItem('sys_config'));
            if(c){ 
                document.documentElement.style.setProperty('--primary-accent', c.cor); 
                document.getElementById('ui-nome').innerText = c.nome;
                if(c.logo){ document.getElementById('ui-logo').innerHTML = `<img src="${c.logo}">`; }
            }
            renderGrade(); escutarFinanceiro(); escutarAgendamentos();
        }

        function gerarGrade() {
            const config = { start: document.getElementById('g-start').value, end: document.getElementById('g-end').value, int: document.getElementById('g-int').value };
            localStorage.setItem('clinica_grade', JSON.stringify(config));
            renderGrade();
        }

        function renderGrade() {
            const g = JSON.parse(localStorage.getItem('clinica_grade'));
            if(!g) return;
            const cont = document.getElementById('agenda-container');
            cont.innerHTML = `<div class="day-col"><div class="day-header"><h3>Agenda Hoje</h3></div><div class="day-body" id="slots-list"></div></div>`;
            const list = document.getElementById('slots-list');
            let s = parseInt(g.start.split(':')[0])*60, e = parseInt(g.end.split(':')[0])*60, i = parseInt(g.int);
            for(let m=s; m<e; m+=i){
                let h = Math.floor(m/60).toString().padStart(2,'0')+":"+(m%60).toString().padStart(2,'0');
                list.innerHTML += `<div class="slot" id="s-${h.replace(':','')}"><span style="font-weight:bold">${h}</span> - <small style="color:gray">Livre</small></div>`;
            }
        }

        function escutarAgendamentos() {
            onSnapshot(collection(db, "agendamentos"), (snap) => {
                renderGrade();
                snap.forEach(d => {
                    const a = d.data();
                    const el = document.getElementById(`s-${a.hora.replace(':','')}`);
                    if(el) {
                        el.className = "slot booked";
                        el.innerHTML = `<b>${a.hora}</b> - ${a.servico} <button onclick="abrirCheckout('${d.id}','${a.servico}')" style="float:right; cursor:pointer; background:none; border:none; color:blue;">Concluir</button>`;
                    }
                });
            });
        }

        let currentId = null, currentServ = "";
        window.abrirCheckout = (id, s) => { currentId = id; currentServ = s; document.getElementById('modal-checkout').classList.add('active'); }
        window.confirmarCheckout = async () => {
            const v = document.getElementById('pay-val').value;
            await addDoc(collection(db, "financeiro"), { data: new Date().toLocaleDateString(), desc: "Consulta: "+currentServ, tipo: 'entrada', valor: parseFloat(v), ts: Date.now() });
            await deleteDoc(doc(db, "agendamentos", currentId));
            fecharModais();
        }
        window.abrirDespesa = () => document.getElementById('modal-despesa').classList.add('active');
        window.salvarDespesa = async () => {
            await addDoc(collection(db, "financeiro"), { data: new Date().toLocaleDateString(), desc: document.getElementById('d-desc').value, tipo: 'saida', valor: parseFloat(document.getElementById('d-val').value), ts: Date.now() });
            fecharModais();
        }
        function escutarFinanceiro() {
            onSnapshot(query(collection(db, "financeiro"), orderBy("ts", "desc")), (snap) => {
                let tin=0, tout=0, html="";
                snap.forEach(d => {
                    const t = d.data();
                    if(t.tipo==='entrada') tin+=t.valor; else tout+=t.valor;
                    html += `<tr><td>${t.data}</td><td>${t.desc}</td><td style="color:${t.tipo==='entrada'?'green':'red'}">${t.tipo}</td><td>${t.valor.toFixed(2)}€</td></tr>`;
                });
                document.getElementById('f-in').innerText = tin.toFixed(2)+"€";
                document.getElementById('f-out').innerText = tout.toFixed(2)+"€";
                document.getElementById('f-total').innerText = (tin-tout).toFixed(2)+"€";
                document.getElementById('f-table').innerHTML = html;
            });
        }
        window.fecharModais = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        window.switchView = (id, el) => { document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
    </script>
</body>
</html>
