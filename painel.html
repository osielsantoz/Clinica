<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Yod - Painel de Gestão</title>
    <style>
        :root { --primary-accent: #3b82f6; --sidebar-bg: #0f172a; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --border-color: #e2e8f0; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { padding: 15px 24px; color: #cbd5e1; cursor: pointer; transition: 0.2s; }
        .nav-item.active { background-color: var(--primary-accent); color: #fff; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .view-section { display: none; max-width: 1200px; margin: 0 auto; } .view-section.active { display: block; }
        .card-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; margin-top: 5px;}
        .btn { background: var(--primary-accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}
        .table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; border-radius: 8px; overflow: hidden; }
        .table th, .table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .week-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .day-check { display: none; }
        .day-label { padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .day-check:checked + .day-label { background: var(--primary-accent); color: white; border-color: var(--primary-accent); }
        .agenda-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; }
        .day-col { min-width: 320px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .day-header { padding: 15px; text-align: center; background: #f8fafc; font-weight: bold; border-radius: 12px 12px 0 0;}
        .slot { border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin: 10px; }
        .slot.booked { border-left: 5px solid var(--primary-accent); background: #f0f7ff; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--sidebar-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">Acesso Yod Micropigmentação</h2>
            <input type="email" id="login-email" placeholder="E-mail da Recepção">
            <input type="password" id="login-senha" placeholder="Senha">
            <button class="btn" onclick="fazerLoginAdmin()">Entrar</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header" id="ui-nome">Yod Micropigmentação</div>
        <div class="nav-item active" onclick="switchView('agenda', this)">📅 Agenda</div>
        <div class="nav-item" onclick="switchView('grade', this)">🕒 Grade Horária</div>
        <div class="nav-item" onclick="switchView('procedimentos', this)">💉 Serviços</div>
        <div class="nav-item" onclick="switchView('financeiro', this)">💰 Financeiro</div>
        <div class="nav-item" style="color: #ef4444; margin-top: auto;" onclick="sairAdmin()">Sair</div>
    </aside>

    <main class="main-content">
        <section id="agenda" class="view-section active">
            <h1>Agenda de Atendimentos</h1>
            <div class="agenda-scroll" id="agenda-container"><p style="padding:40px; color:gray;">Carregando agenda...</p></div>
        </section>

        <section id="grade" class="view-section">
            <h1>Configurar Dias e Horários</h1>
            <div class="card-container">
                <label>Dias Ativos</label>
                <div class="week-selector">
                    <input type="checkbox" id="d1" class="day-check" value="1"><label for="d1" class="day-label">Seg</label>
                    <input type="checkbox" id="d2" class="day-check" value="2"><label for="d2" class="day-label">Ter</label>
                    <input type="checkbox" id="d3" class="day-check" value="3"><label for="d3" class="day-label">Qua</label>
                    <input type="checkbox" id="d4" class="day-check" value="4"><label for="d4" class="day-label">Qui</label>
                    <input type="checkbox" id="d5" class="day-check" value="5"><label for="d5" class="day-label">Sex</label>
                    <input type="checkbox" id="d6" class="day-check" value="6"><label for="d6" class="day-label">Sáb</label>
                    <input type="checkbox" id="d0" class="day-check" value="0"><label for="d0" class="day-label">Dom</label>
                </div>
                <div class="form-grid">
                    <div><label>Abertura</label><input type="time" id="g-start" value="08:00"></div>
                    <div><label>Fechamento</label><input type="time" id="g-end" value="18:00"></div>
                    <div><label>Intervalo</label><select id="g-int"><option value="30">30 min</option><option value="60" selected>60 min</option></select></div>
                </div>
                <button class="btn" onclick="salvarGrade()">⚙️ Atualizar Grade</button>
            </div>
        </section>

        <section id="procedimentos" class="view-section">
            <h1>Gerir Serviços</h1>
            <div class="card-container">
                <div class="form-grid">
                    <div><label>Nome do Serviço</label><input type="text" id="p-nome" placeholder="Ex: Micropigmentação Labial"></div>
                    <div><label>Valor (R$)</label><input type="number" id="p-valor" placeholder="200"></div>
                </div>
                <button class="btn" style="width: auto; padding: 12px 30px;" onclick="adicionarProcedimento()">+ Cadastrar</button>
            </div>
            <table class="table"><thead><tr><th>Serviço</th><th>Valor</th><th>Ação</th></tr></thead><tbody id="lista-procedimentos"></tbody></table>
        </section>

        <section id="financeiro" class="view-section">
            <h1>Fluxo de Caixa</h1>
            <table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody id="f-table"></tbody></table>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

        onAuthStateChanged(auth, (u) => { 
            if(u) { document.getElementById('login-overlay').style.display='none'; carregarSetup(); } 
            else { document.getElementById('login-overlay').style.display='flex'; }
        });

        window.fazerLoginAdmin = () => { signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-senha').value).catch(e => alert("Acesso negado.")); }
        window.sairAdmin = () => signOut(auth);

        async function carregarSetup() {
            const snap = await getDoc(doc(db, "configuracoes", "geral"));
            if(snap.exists()){ document.documentElement.style.setProperty('--primary-accent', snap.data().cor); document.getElementById('ui-nome').innerText = snap.data().nome; }
            escutarAgendamentos(); carregarGrade(); escutarProcedimentos(); escutarFinanceiro();
        }

        window.salvarGrade = async () => {
            let d = []; document.querySelectorAll('.day-check:checked').forEach(c => d.push(parseInt(c.value)));
            await setDoc(doc(db, "configuracoes", "grade"), { start: document.getElementById('g-start').value, end: document.getElementById('g-end').value, int: document.getElementById('g-int').value, dias: d });
            alert("Grade Yod atualizada!");
        }

        async function carregarGrade() {
            const snap = await getDoc(doc(db, "configuracoes", "grade"));
            if(snap.exists()){ const g = snap.data(); document.getElementById('g-start').value=g.start; document.getElementById('g-end').value=g.end; document.getElementById('g-int').value=g.int; g.dias.forEach(d => document.getElementById('d'+d).checked=true); }
        }

        window.adicionarProcedimento = async () => {
            const n = document.getElementById('p-nome').value, v = document.getElementById('p-valor').value;
            if(n && v) { await addDoc(collection(db, "procedimentos"), { nome: n, valor: parseFloat(v) }); document.getElementById('p-nome').value=''; document.getElementById('p-valor').value=''; }
        }

        function escutarProcedimentos() { onSnapshot(collection(db, "procedimentos"), (s) => { let h=""; s.forEach(d => h+=`<tr><td>${d.data().nome}</td><td>R$ ${d.data().valor.toFixed(2)}</td><td><button onclick="deletarP('${d.id}')" style="color:red;cursor:pointer;background:none;border:none;">Excluir</button></td></tr>`); document.getElementById('lista-procedimentos').innerHTML=h; }); }
        window.deletarP = async (id) => await deleteDoc(doc(db, "procedimentos", id));

        function escutarAgendamentos() {
            onSnapshot(query(collection(db, "agendamentos"), orderBy("ts", "asc")), (s) => {
                const c = document.getElementById('agenda-container'); c.innerHTML="";
                s.forEach(d => { const a = d.data(); const num = a.pacienteWhatsapp ? a.pacienteWhatsapp.replace(/\D/g,'') : '';
                    c.innerHTML += `<div class="day-col"><div class="day-header">${a.data} - ${a.hora}</div><div class="day-body"><div class="slot booked"><b>${a.pacienteNome}</b><br><small>${a.servico}</small><br><a href="https://wa.me/55${num}" target="_blank" style="color:green;text-decoration:none;font-size:0.8rem;">📲 WhatsApp</a><button class="btn" style="background:green;font-size:0.7rem;margin-top:10px;" onclick="concluir('${d.id}','${a.servico}',${a.valor})">Concluir</button></div></div></div>`;
                });
            });
        }

        window.concluir = async (id, s, v) => { await addDoc(collection(db, "financeiro"), { data: new Date().toLocaleDateString(), descricao: s, tipo: 'entrada', valor: v, ts: Date.now() }); await deleteDoc(doc(db, "agendamentos", id)); }

        function escutarFinanceiro() { onSnapshot(query(collection(db, "financeiro"), orderBy("ts", "desc")), (s) => { let h=""; s.forEach(d => { const t=d.data(); h+=`<tr><td>${t.data}</td><td>${t.descricao}</td><td>${t.tipo}</td><td>R$ ${t.valor.toFixed(2)}</td></tr>`; }); document.getElementById('f-table').innerHTML=h; }); }

        window.switchView = (id, el) => { document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
    </script>
</body>
</html>
