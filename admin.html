<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - YOD Estética</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap');

        :root {
            --primary: #D4B5B0;
            --background: #F4F0EF;
            --white: #FFFFFF;
            --text-dark: #333;
            --border: #DDD;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1, h2 {
            color: #4A4A4A;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
        }

        .helper-text {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }

        button:hover {
            background-color: #C1A29D;
        }

        .btn-danger {
            background-color: #FF5A5F;
        }

        .btn-danger:hover {
            background-color: #E0484D;
        }

        .admin-list {
            margin-top: 3rem;
            border-top: 2px solid var(--border);
            padding-top: 2rem;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .list-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
        }

        .item-info {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-actions">
            <h1>Painel Administrativo de Produtos</h1>
            <button id="btnGenerateTests" style="background-color: #4A4A4A;">Gerar Produtos de Teste</button>
        </div>
        <p>Crie e edite os serviços do catálogo YOD.</p>

        <form id="productForm">
            <input type="hidden" id="productId">
            
            <div class="form-group">
                <label>Nome do Serviço</label>
                <input type="text" id="name" required placeholder="Ex: Micropigmentação de Sobrancelhas">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea id="description" rows="4" required placeholder="Detalhes sobre o procedimento..."></textarea>
            </div>

            <div class="form-group">
                <label>Valor (R$)</label>
                <input type="number" step="0.01" id="price" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Imagens (Até 5 fotos)</label>
                <textarea id="images" rows="3" required placeholder="Cole as URLs das imagens separadas por vírgula. A primeira será a capa."></textarea>
                <div class="helper-text">
                    <strong>Atenção ao tamanho:</strong> Para os banners de capa (primeira foto), o tamanho ideal é <strong>800x600 pixels (formato paisagem)</strong> ou quadrado (1080x1080). Limite de 5 imagens.
                </div>
            </div>

            <button type="submit" id="submitBtn">Salvar Serviço</button>
            <button type="button" id="cancelBtn" style="display:none; background:#888;">Cancelar Edição</button>
        </form>

        <div class="admin-list">
            <h2>Serviços Cadastrados</h2>
            <div id="productList">Carregando...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // CREDENCIAIS DO FIREBASE ATUALIZADAS
        const firebaseConfig = { 
            apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", 
            authDomain: "clinicabase-a85a7.firebaseapp.com", 
            projectId: "clinicabase-a85a7", 
            storageBucket: "clinicabase-a85a7.firebasestorage.app", 
            messagingSenderId: "324071825277", 
            appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const form = document.getElementById('productForm');
        const listDiv = document.getElementById('productList');

        async function loadAdminProducts() {
            listDiv.innerHTML = 'Carregando...';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                listDiv.innerHTML = '';
                
                if(querySnapshot.empty) {
                    listDiv.innerHTML = '<p>Nenhum serviço cadastrado.</p>';
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    const id = documento.id;
                    const coverImg = (data.images && data.images.length > 0) ? data.images[0] : 'https://via.placeholder.com/150';

                    const item = document.createElement('div');
                    item.className = 'list-item';
                    item.innerHTML = `
                        <div class="item-info">
                            <img src="${coverImg}" alt="${data.name}">
                            <div>
                                <strong>${data.name}</strong><br>
                                R$ ${parseFloat(data.price).toFixed(2).replace('.', ',')}
                            </div>
                        </div>
                        <div>
                            <button onclick="editProduct('${id}', '${data.name.replace(/'/g, "\\'")}', '${data.description.replace(/'/g, "\\'")}', '${data.price}', '${data.images.join(',')}')">Editar</button>
                            <button class="btn-danger" onclick="deleteProduct('${id}')">Excluir</button>
                        </div>
                    `;
                    listDiv.appendChild(item);
                });
            } catch (error) {
                listDiv.innerHTML = '<p style="color:red">Erro ao carregar dados. Verifique a conexão com o Firebase.</p>';
                console.error(error);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('productId').value;
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;
            const price = parseFloat(document.getElementById('price').value);
            
            let imgArray = document.getElementById('images').value.split(',').map(u => u.trim()).filter(u => u);
            if (imgArray.length > 5) {
                imgArray = imgArray.slice(0, 5);
                alert("Aviso: Apenas as 5 primeiras imagens foram salvas.");
            }

            const productData = { name, description, price, images: imgArray };

            try {
                if(id) {
                    await updateDoc(doc(db, "products", id), productData);
                    alert("Serviço atualizado!");
                } else {
                    await addDoc(collection(db, "products"), productData);
                    alert("Serviço criado com sucesso!");
                }
                form.reset();
                document.getElementById('productId').value = '';
                document.getElementById('cancelBtn').style.display = 'none';
                document.getElementById('submitBtn').innerText = 'Salvar Serviço';
                loadAdminProducts();
            } catch (error) {
                alert("Erro ao salvar. Verifique o console.");
                console.error(error);
            }
        });

        window.deleteProduct = async (id) => {
            if(confirm("Tem certeza que deseja excluir este serviço?")) {
                await deleteDoc(doc(db, "products", id));
                loadAdminProducts();
            }
        };

        window.editProduct = (id, name, desc, price, imgs) => {
            document.getElementById('productId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('description').value = desc;
            document.getElementById('price').value = price;
            document.getElementById('images').value = imgs;
            
            document.getElementById('submitBtn').innerText = 'Atualizar Serviço';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            window.scrollTo(0, 0);
        };

        document.getElementById('cancelBtn').addEventListener('click', () => {
            form.reset();
            document.getElementById('productId').value = '';
            document.getElementById('submitBtn').innerText = 'Salvar Serviço';
            document.getElementById('cancelBtn').style.display = 'none';
        });

        document.getElementById('btnGenerateTests').addEventListener('click', async () => {
            const testData = [
                {
                    name: "Micropigmentação Fio a Fio",
                    description: "Técnica que desenha fios realistas acompanhando o formato natural da sobrancelha, preenchendo falhas e garantindo um olhar expressivo com naturalidade.",
                    price: 450.00,
                    images: ["https://images.unsplash.com/photo-1596704017254-9b121068fb31?w=800", "https://images.unsplash.com/photo-1620052329718-701f41334fcd?w=800"]
                },
                {
                    name: "Limpeza de Pele Profunda",
                    description: "Procedimento completo para remoção de cravos, miliuns e impurezas. Acompanha máscara de argila rosa para acalmar a pele e revitalizar a derme.",
                    price: 120.00,
                    images: ["https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=800"]
                },
                {
                    name: "Revitalização Labial",
                    description: "Técnica que traz cor e vida aos lábios pálidos ou arroxeados. Efeito natural semelhante a um lip tint permanente.",
                    price: 350.00,
                    images: ["https://images.unsplash.com/photo-1617300305885-300eec2614b6?w=800"]
                }
            ];

            try {
                document.getElementById('btnGenerateTests').innerText = 'Gerando...';
                for (const item of testData) {
                    await addDoc(collection(db, "products"), item);
                }
                alert("Produtos de teste inseridos no banco com sucesso!");
                document.getElementById('btnGenerateTests').innerText = 'Gerar Produtos de Teste';
                loadAdminProducts();
            } catch (error) {
                alert("Erro ao inserir testes. Verifique as configurações do Firebase.");
                console.error(error);
                document.getElementById('btnGenerateTests').innerText = 'Gerar Produtos de Teste';
            }
        });

        loadAdminProducts();
    </script>
</body>
</html>
