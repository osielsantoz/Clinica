<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Configurações</title>
    <style>
        :root { --primary-accent: #4f46e5; --bg-color: #f4f4f5; --card-bg: #ffffff; --text-main: #09090b; --border-color: #e4e4e7; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; }
        .sidebar { width: 260px; background-color: #09090b; color: #fff; padding: 20px; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .card-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-bottom: 24px; }
        input[type="text"], input[type="color"] { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; }
        .btn { background: var(--primary-accent); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .upload-box { border: 2px dashed var(--border-color); border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 15px;}
        .upload-box img { max-width: 150px; border-radius: 6px; }
    </style>
</head>
<body>
    <aside class="sidebar"><h2>⚙️ Admin Master</h2></aside>
    <main class="main-content">
        <h1>Identidade Global do Sistema</h1>
        <div class="card-container">
            <label>Nome da Clínica</label><input type="text" id="cfg-nome" placeholder="Ex: Clínica Alpha">
            <label>Logomarca</label>
            <div class="upload-box" onclick="document.getElementById('file-logo').click()">
                <input type="file" id="file-logo" accept="image/*" style="display: none;" onchange="previewUpload(event)">
                <div id="upload-preview"><span>📁 Clique para carregar logo</span></div>
            </div>
            <label>Cor Principal</label><input type="color" id="cfg-cor" value="#4f46e5">
            <button class="btn" onclick="salvarConfig()">Salvar na Nuvem</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let logoBase64 = null;

        window.onload = async () => {
            const docSnap = await getDoc(doc(db, "configuracoes", "geral"));
            if(docSnap.exists()) {
                const c = docSnap.data();
                document.getElementById('cfg-nome').value = c.nome; document.getElementById('cfg-cor').value = c.cor;
                if(c.logo){ logoBase64 = c.logo; document.getElementById('upload-preview').innerHTML = `<img src="${c.logo}">`; }
            }
        };

        window.previewUpload = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { logoBase64 = event.target.result; document.getElementById('upload-preview').innerHTML = `<img src="${logoBase64}">`; };
            reader.readAsDataURL(e.target.files[0]);
        };

        window.salvarConfig = async () => {
            await setDoc(doc(db, "configuracoes", "geral"), { nome: document.getElementById('cfg-nome').value, cor: document.getElementById('cfg-cor').value, logo: logoBase64 });
            alert("Salvo com sucesso!");
        };
    </script>
</body>
</html>
