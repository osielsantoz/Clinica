<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - YOD Estética</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hidden-view { display: none !important; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: #D4A3A3; box-shadow: 0 0 0 2px rgba(212, 163, 163, 0.2); }
        .form-label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-2xl font-serif tracking-wider text-[#D4A3A3]">YOD</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Painel Gestor</p>
        </div>
        <nav class="flex-1 p-4">
            <a href="#" class="flex items-center gap-3 bg-[#D4A3A3] text-gray-900 px-4 py-3 rounded-lg font-medium">
                <i class="fas fa-box"></i> Produtos & Serviços
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
        
        <!-- Topbar -->
        <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-700" id="headerTitle">Gerenciar Catálogo</h2>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-500">Logado como Admin</span>
                <div class="w-8 h-8 rounded-full bg-[#D4A3A3] text-white flex items-center justify-center"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="p-8">
            <!-- VIEW: LISTAGEM -->
            <div id="listView" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-800">Todos os Serviços</h3>
                    <button onclick="showForm()" class="bg-[#D4A3A3] hover:bg-[#C08F8F] text-white px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2">
                        <i class="fas fa-plus"></i> Adicionar Novo
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider">
                                <th class="px-6 py-4 font-medium">Capa</th>
                                <th class="px-6 py-4 font-medium">Serviço</th>
                                <th class="px-6 py-4 font-medium">Valor</th>
                                <th class="px-6 py-4 font-medium">Promocional</th>
                                <th class="px-6 py-4 font-medium text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="productList" class="divide-y divide-gray-100">
                            <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Carregando catálogo...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- VIEW: FORMULÁRIO -->
            <div id="formView" class="hidden-view">
                <button onclick="showList()" class="mb-6 text-gray-500 hover:text-gray-800 flex items-center gap-2 font-medium transition-colors">
                    <i class="fas fa-arrow-left"></i> Voltar para a lista
                </button>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                    <h3 class="text-xl font-semibold mb-6 border-b pb-4" id="formTitle">Adicionar Novo Serviço</h3>
                    
                    <form id="productForm" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <input type="hidden" id="productId">
                        
                        <!-- Coluna 1: Informações de Texto e Valores -->
                        <div class="space-y-5">
                            <div>
                                <label class="form-label">Nome do Serviço</label>
                                <input type="text" id="name" class="form-input" required placeholder="Ex: Micropigmentação Fio a Fio">
                            </div>
                            
                            <div>
                                <label class="form-label">Descrição Curta (Aparece no card pequeno)</label>
                                <input type="text" id="shortDesc" class="form-input" required placeholder="Ex: Efeito natural e preenchimento perfeito." maxlength="100">
                            </div>

                            <div>
                                <label class="form-label">Descrição Longa (Aparece ao clicar para ver detalhes)</label>
                                <textarea id="fullDesc" rows="4" class="form-input" required placeholder="Explique os detalhes, benefícios e como funciona o procedimento..."></textarea>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="form-label">Valor Padrão (R$)</label>
                                    <input type="number" step="0.01" id="price" class="form-input" required placeholder="0.00">
                                </div>
                                <div>
                                    <label class="form-label text-green-600">Valor Promocional (R$ - Opcional)</label>
                                    <input type="number" step="0.01" id="promoPrice" class="form-input" placeholder="0.00">
                                </div>
                            </div>
                        </div>

                        <!-- Coluna 2: Imagens -->
                        <div class="space-y-4 bg-gray-50 p-6 rounded-xl border border-gray-200">
                            <h4 class="font-medium text-gray-700 mb-2 border-b pb-2">Imagens do Serviço (Cole as URLs)</h4>
                            
                            <div>
                                <label class="form-label text-indigo-600 font-bold"><i class="fas fa-star text-xs"></i> Foto 1 (Capa Principal)</label>
                                <input type="url" id="img1" class="form-input" required placeholder="https://link-da-foto-capa.jpg">
                            </div>
                            <div>
                                <label class="form-label">Foto 2 (Opcional)</label>
                                <input type="url" id="img2" class="form-input" placeholder="https://link-da-foto.jpg">
                            </div>
                            <div>
                                <label class="form-label">Foto 3 (Opcional)</label>
                                <input type="url" id="img3" class="form-input" placeholder="https://link-da-foto.jpg">
                            </div>
                            <div>
                                <label class="form-label">Foto 4 (Opcional)</label>
                                <input type="url" id="img4" class="form-input" placeholder="https://link-da-foto.jpg">
                            </div>
                            <div>
                                <label class="form-label">Foto 5 (Opcional)</label>
                                <input type="url" id="img5" class="form-input" placeholder="https://link-da-foto.jpg">
                            </div>
                        </div>

                        <div class="lg:col-span-2 pt-4 flex justify-end gap-3 border-t">
                            <button type="button" onclick="showList()" class="px-6 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-100 transition-colors">Cancelar</button>
                            <button type="submit" class="bg-gray-900 hover:bg-black text-white px-8 py-2.5 rounded-lg font-medium transition-colors shadow-lg">Salvar Serviço</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", 
            authDomain: "clinicabase-a85a7.firebaseapp.com", 
            projectId: "clinicabase-a85a7", 
            storageBucket: "clinicabase-a85a7.firebasestorage.app", 
            messagingSenderId: "324071825277", 
            appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allProducts = [];

        // Controle de Views
        window.showForm = (isEdit = false) => {
            document.getElementById('listView').classList.add('hidden-view');
            document.getElementById('formView').classList.remove('hidden-view');
            document.getElementById('formTitle').innerText = isEdit ? 'Editar Serviço' : 'Adicionar Novo Serviço';
            if(!isEdit) document.getElementById('productForm').reset();
            window.scrollTo(0,0);
        }

        window.showList = () => {
            document.getElementById('formView').classList.add('hidden-view');
            document.getElementById('listView').classList.remove('hidden-view');
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
        }

        const formatMoney = (val) => val ? `R$ ${parseFloat(val).toFixed(2).replace('.', ',')}` : '-';

        async function loadAdminProducts() {
            const listDiv = document.getElementById('productList');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                listDiv.innerHTML = '';
                allProducts = [];
                
                if(querySnapshot.empty) {
                    listDiv.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Nenhum serviço cadastrado. Comece adicionando um novo!</td></tr>';
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    data.id = documento.id;
                    allProducts.push(data);

                    const coverImg = (data.images && data.images.length > 0) ? data.images[0] : 'https://placehold.co/100';
                    const hasPromo = data.promoPrice && parseFloat(data.promoPrice) > 0;

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4"><img src="${coverImg}" class="w-14 h-14 object-cover rounded-lg shadow-sm"></td>
                        <td class="px-6 py-4 font-medium text-gray-800">${data.name}<br><span class="text-xs text-gray-400 font-normal">${data.shortDesc ? data.shortDesc.substring(0,40)+'...' : ''}</span></td>
                        <td class="px-6 py-4 text-gray-600 ${hasPromo ? 'line-through text-xs' : 'font-semibold'}">${formatMoney(data.price)}</td>
                        <td class="px-6 py-4 font-semibold text-green-600">${hasPromo ? formatMoney(data.promoPrice) : '-'}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="editProduct('${data.id}')" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 px-3 py-1.5 rounded-md mr-2 transition-colors"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct('${data.id}')" class="text-red-600 hover:text-red-900 bg-red-50 px-3 py-1.5 rounded-md transition-colors"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    listDiv.appendChild(tr);
                });
            } catch (error) {
                listDiv.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Erro ao carregar dados do Firebase.</td></tr>';
                console.error(error);
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = 'Salvando...';
            submitBtn.disabled = true;
            
            const id = document.getElementById('productId').value;
            
            // Coletar e limpar array de imagens
            const images = [
                document.getElementById('img1').value.trim(),
                document.getElementById('img2').value.trim(),
                document.getElementById('img3').value.trim(),
                document.getElementById('img4').value.trim(),
                document.getElementById('img5').value.trim(),
            ].filter(url => url !== "");

            const productData = { 
                name: document.getElementById('name').value, 
                shortDesc: document.getElementById('shortDesc').value,
                fullDesc: document.getElementById('fullDesc').value,
                price: parseFloat(document.getElementById('price').value) || 0,
                promoPrice: parseFloat(document.getElementById('promoPrice').value) || null,
                images: images 
            };

            try {
                if(id) {
                    await updateDoc(doc(db, "products", id), productData);
                } else {
                    await addDoc(collection(db, "products"), productData);
                }
                showList();
                loadAdminProducts();
            } catch (error) {
                alert("Erro ao salvar serviço.");
                console.error(error);
            } finally {
                submitBtn.innerText = 'Salvar Serviço';
                submitBtn.disabled = false;
            }
        });

        window.deleteProduct = async (id) => {
            if(confirm("Excluir permanentemente este serviço?")) {
                await deleteDoc(doc(db, "products", id));
                loadAdminProducts();
            }
        };

        window.editProduct = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;

            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('shortDesc').value = product.shortDesc || '';
            document.getElementById('fullDesc').value = product.fullDesc || product.description || '';
            document.getElementById('price').value = product.price;
            document.getElementById('promoPrice').value = product.promoPrice || '';

            // Preencher campos de imagem
            const imgInputs = ['img1', 'img2', 'img3', 'img4', 'img5'];
            imgInputs.forEach((imgId, index) => {
                document.getElementById(imgId).value = product.images && product.images[index] ? product.images[index] : '';
            });

            showForm(true);
        };

        loadAdminProducts();
    </script>
</body>
</html>
