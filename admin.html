<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Master - Yod Micropigmentação</title>
    <style>
        :root { --sidebar-bg: #09090b; --primary-accent: #4f46e5; --bg-color: #f4f4f5; --card-bg: #ffffff; --text-main: #09090b; --border-color: #e4e4e7; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px; font-size: 1.1rem; font-weight: 900; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-menu { padding: 20px 0; }
        .nav-item { padding: 15px 24px; color: #a1a1aa; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: var(--primary-accent); color: #fff; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .view-section { display: none; max-width: 800px; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-bottom: 24px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; margin-bottom: 15px; outline: none;}
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .btn { background: var(--primary-accent); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .upload-box { border: 2px dashed var(--border-color); border-radius: 10px; background: #fafafa; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .upload-box img { max-width: 150px; border-radius: 6px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">⚙️ Yod - Admin Master</div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="switchView('identidade', this)">🎨 Marca e Cores</div>
            <div class="nav-item" onclick="switchView('acessos', this)">🔑 Gerenciar Acessos</div>
        </div>
    </aside>

    <main class="main-content">
        <section id="identidade" class="view-section active">
            <h1>Configuração do Sistema</h1>
            <p style="color:gray; margin-bottom: 20px;">Personalize a aparência do portal e do painel.</p>
            <div class="card-container">
                <label>Nome do Estabelecimento</label>
                <input type="text" id="cfg-nome" value="Yod Micropigmentação e Estética">
                <label>Logomarca</label>
                <div class="upload-box" onclick="document.getElementById('file-logo').click()">
                    <input type="file" id="file-logo" accept="image/*" style="display: none;" onchange="previewUpload(event)">
                    <div id="upload-preview"><span>📁 Clique para trocar a logo</span></div>
                </div>
                <label>Cor Principal</label>
                <input type="color" id="cfg-cor" value="#4f46e5">
                <button class="btn" onclick="salvarConfig()">Salvar Configurações</button>
            </div>
        </section>

        <section id="acessos" class="view-section">
            <h1>Gerenciar Acessos</h1>
            <p style="color:gray; margin-bottom: 20px;">Crie o e-mail e senha para a recepção acessar o painel.</p>
            <div class="card-container">
                <label>E-mail da Recepção</label>
                <input type="email" id="new-email" placeholder="exemplo@yod.com">
                <label>Senha de Acesso</label>
                <input type="text" id="new-pass" placeholder="Mínimo 6 dígitos">
                <button class="btn" style="background: var(--success);" onclick="criarUsuarioPainel()">Criar Acesso ao Painel</button>
                <p id="msg-acesso" style="margin-top:15px; font-weight:bold; text-align:center;"></p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

        let logoBase64 = null;

        window.onload = async () => {
            const docSnap = await getDoc(doc(db, "configuracoes", "geral"));
            if(docSnap.exists()) {
                const c = docSnap.data();
                document.getElementById('cfg-nome').value = c.nome; document.getElementById('cfg-cor').value = c.cor;
                if(c.logo){ logoBase64 = c.logo; document.getElementById('upload-preview').innerHTML = `<img src="${c.logo}">`; }
            }
        };

        window.previewUpload = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { logoBase64 = event.target.result; document.getElementById('upload-preview').innerHTML = `<img src="${logoBase64}">`; };
            reader.readAsDataURL(e.target.files[0]);
        };

        window.salvarConfig = async () => {
            await setDoc(doc(db, "configuracoes", "geral"), { nome: document.getElementById('cfg-nome').value, cor: document.getElementById('cfg-cor').value, logo: logoBase64 });
            alert("Identidade da Yod atualizada!");
        };

        window.criarUsuarioPainel = async () => {
            const email = document.getElementById('new-email').value;
            const pass = document.getElementById('new-pass').value;
            const msg = document.getElementById('msg-acesso');

            if(!email || pass.length < 6) return alert("E-mail inválido ou senha muito curta.");

            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                msg.style.color = "green";
                msg.innerText = "✅ Usuário criado! Agora use este e-mail e senha no /painel";
                document.getElementById('new-email').value = ''; document.getElementById('new-pass').value = '';
            } catch (e) {
                msg.style.color = "red";
                msg.innerText = "❌ Erro: Usuário já existe ou conexão falhou.";
            }
        }

        window.switchView = (id, el) => { document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
    </script>
</body>
</html>
