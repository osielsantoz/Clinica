<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - YOD Estética (Supabase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cropper.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hidden-view { display: none !important; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: #D4A3A3; box-shadow: 0 0 0 2px rgba(212, 163, 163, 0.2); }
        .form-label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
        
        .upload-box { position: relative; width: 100%; aspect-ratio: 4/3; border: 2px dashed #d1d5db; border-radius: 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background-color: #f9fafb; transition: 0.2s; }
        .upload-box:hover { border-color: #D4A3A3; background-color: #fff; }
        .upload-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
        .upload-box.has-image .upload-preview { display: block; }
        .upload-box.has-image .upload-placeholder { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 relative">

    <script type="module">
        if (localStorage.getItem('yod_logged') !== 'true' && sessionStorage.getItem('yod_logged') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex z-10">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-serif tracking-wider text-[#D4A3A3]">YOD</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Painel do Gestor</p>
            </div>
        </div>
        <nav class="flex-1 p-4">
            <a href="#" class="flex items-center gap-3 bg-[#D4A3A3] text-gray-900 px-4 py-3 rounded-lg font-medium">
                <i class="fas fa-box"></i> Produtos & Serviços
            </a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white py-2.5 rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-sign-out-alt"></i> Sair do Sistema
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10">
            <h2 class="text-xl font-semibold text-gray-700">Painel Administrativo</h2>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-500 hidden sm:block">Admin</span>
                <div class="w-8 h-8 rounded-full bg-[#D4A3A3] text-white flex items-center justify-center"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="p-4 md:p-8">
            <!-- Listagem -->
            <div id="listView" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all">
                <div class="p-4 md:p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">Todos os Serviços</h3>
                        <p class="text-xs text-gray-400 mt-0.5"></p>
                    </div>
                    <button onclick="showForm()" class="w-full sm:w-auto bg-[#D4A3A3] hover:bg-[#C08F8F] text-white px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                        <i class="fas fa-plus"></i> Adicionar Novo
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[700px]">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider">
                                <th class="px-4 py-4 font-medium text-center">Ordem</th>
                                <th class="px-6 py-4 font-medium">Capa</th>
                                <th class="px-6 py-4 font-medium">Serviço</th>
                                <th class="px-6 py-4 font-medium">Valor</th>
                                <th class="px-6 py-4 font-medium">Status / Destaque</th>
                                <th class="px-6 py-4 font-medium text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="productList" class="divide-y divide-gray-100">
                            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Carregando catálogo...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Formulário -->
            <div id="formView" class="hidden-view">
                <button onclick="showList()" class="mb-6 text-gray-500 hover:text-gray-800 flex items-center gap-2 font-medium transition-colors">
                    <i class="fas fa-arrow-left"></i> Voltar para a lista
                </button>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 md:p-8 mb-10">
                    <h3 class="text-xl font-semibold mb-6 border-b pb-4" id="formTitle">Adicionar Novo Serviço</h3>
                    
                    <form id="productForm" class="flex flex-col gap-8">
                        <input type="hidden" id="productId">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-5">
                                <div>
                                    <label class="form-label">Nome do Serviço</label>
                                    <input type="text" id="name" class="form-input" required placeholder="Ex: Micropigmentação Fio a Fio">
                                </div>
                                <div>
                                    <label class="form-label">Descrição Curta</label>
                                    <input type="text" id="shortDesc" class="form-input" required placeholder="Resumo do card" maxlength="100">
                                </div>
                                
                                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" id="isActive" checked class="w-5 h-5 text-green-600 rounded focus:ring-green-500 cursor-pointer">
                                        <label for="isActive" class="text-sm font-semibold text-gray-700 cursor-pointer">
                                            Serviço Ativo
                                        </label>
                                    </div>
                                    <div class="flex items-center gap-3 pt-2 border-t border-gray-200">
                                        <input type="checkbox" id="isPromo" class="w-5 h-5 text-[#D4A3A3] rounded focus:ring-[#D4A3A3] cursor-pointer">
                                        <label for="isPromo" class="text-sm font-semibold text-gray-700 cursor-pointer">
                                            Destacar nas Ofertas Especiais
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="space-y-5">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="form-label">Valor Padrão (R$)</label>
                                        <input type="number" step="0.01" id="price" class="form-input" required placeholder="0.00">
                                    </div>
                                    <div>
                                        <label class="form-label text-green-600">Valor Promocional (R$)</label>
                                        <input type="number" step="0.01" id="promoPrice" class="form-input" placeholder="Opcional">
                                    </div>
                                </div>
                                <div>
                                    <label class="form-label">Descrição Longa</label>
                                    <textarea id="fullDesc" rows="3" class="form-input" required placeholder="Detalhes completos..."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Upload de Imagens -->
                        <div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
                            <h4 class="font-medium text-gray-700 mb-4 border-b pb-2">Fotos do Serviço (Até 5 fotos)</h4>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                                <script>
                                    for(let i=1; i<=5; i++) {
                                        document.write(`
                                            <div>
                                                <label class="text-xs font-bold ${i===1?'text-[#D4A3A3]':'text-gray-500'} block text-center mb-1">FOTO ${i} ${i===1?'(CAPA)*':''}</label>
                                                <div class="upload-box" id="box${i}" onclick="document.getElementById('file${i}').click()">
                                                    <input type="file" id="file${i}" accept="image/*" class="hidden" onchange="openCropper(event, ${i})">
                                                    <input type="hidden" id="url${i}">
                                                    <img id="preview${i}" class="upload-preview">
                                                    <div class="upload-placeholder text-center text-gray-400">
                                                        <i class="fas fa-${i===1?'camera':'plus'} text-2xl mb-1"></i><p class="text-[10px] uppercase">${i===1?'Upload':'Opcional'}</p>
                                                    </div>
                                                </div>
                                                <button type="button" onclick="removeImage(${i})" id="btnRemove${i}" class="hidden w-full text-xs text-red-500 mt-1 hover:underline">Remover</button>
                                            </div>
                                        `);
                                    }
                                </script>
                            </div>
                        </div>

                        <div class="pt-4 flex justify-end gap-3 border-t">
                            <button type="button" onclick="showList()" class="px-6 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-100">Cancelar</button>
                            <button type="submit" id="submitBtn" class="bg-gray-900 hover:bg-black text-white px-8 py-2.5 rounded-lg font-medium shadow-lg flex items-center gap-2">
                                <i class="fas fa-save"></i> <span>Salvar Serviço</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Corte -->
    <div id="cropModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl overflow-hidden w-full max-w-3xl flex flex-col max-h-[90vh] shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-semibold text-gray-800"><i class="fas fa-crop-alt mr-2"></i>Ajustar Imagem</h3>
                <button onclick="closeCropper()" class="text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 bg-gray-900 p-2 min-h-[40vh] sm:min-h-[60vh] flex items-center justify-center">
                <img id="imageToCrop" class="max-w-full max-h-full block">
            </div>
            <div class="p-4 border-t flex justify-between items-center gap-4 bg-gray-50">
                <span class="text-xs text-gray-500"><i class="fas fa-info-circle"></i> Ajuste o enquadramento.</span>
                <div class="flex gap-3">
                    <button type="button" onclick="closeCropper()" class="px-5 py-2.5 text-gray-600 bg-gray-200 rounded-lg font-medium">Cancelar</button>
                    <button type="button" onclick="confirmCrop()" class="px-6 py-2.5 bg-[#D4A3A3] text-white rounded-lg font-medium shadow-md">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Supabase Admin -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://jjekkkvezunxquvsyqek.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_mcH9rB1LkliFvxoplIhAdQ_uPl0B0BO';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allProducts = [];
        let cropper = null;
        let currentCropBox = null;
        let finalBlobs = { 1: null, 2: null, 3: null, 4: null, 5: null };

        window.logout = () => {
            sessionStorage.removeItem('yod_logged');
            localStorage.removeItem('yod_logged');
            window.location.href = 'login.html';
        };

        window.openCropper = (event, num) => {
            const file = event.target.files[0];
            if (file) {
                currentCropBox = num;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imageElement = document.getElementById('imageToCrop');
                    imageElement.src = e.target.result;
                    document.getElementById('cropModal').classList.remove('hidden');
                    document.getElementById('cropModal').classList.add('flex');
                    if (cropper) { cropper.destroy(); }
                    setTimeout(() => {
                        cropper = new Cropper(imageElement, { aspectRatio: 4 / 3, viewMode: 1, dragMode: 'move', autoCropArea: 1 });
                    }, 100);
                }
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        };

        window.closeCropper = () => {
            document.getElementById('cropModal').classList.add('hidden');
            document.getElementById('cropModal').classList.remove('flex');
            if (cropper) { cropper.destroy(); cropper = null; }
            currentCropBox = null;
        };

        window.confirmCrop = () => {
            if (!cropper) return;
            cropper.getCroppedCanvas({ width: 800, height: 600, imageSmoothingQuality: 'high' }).toBlob((blob) => {
                const num = currentCropBox;
                finalBlobs[num] = blob;
                const previewUrl = URL.createObjectURL(blob);
                document.getElementById(`preview${num}`).src = previewUrl;
                document.getElementById(`box${num}`).classList.add('has-image');
                document.getElementById(`btnRemove${num}`).classList.remove('hidden');
                closeCropper();
            }, 'image/jpeg', 0.85);
        };

        window.removeImage = (num) => {
            document.getElementById(`url${num}`).value = '';   
            document.getElementById(`preview${num}`).src = ''; 
            document.getElementById(`box${num}`).classList.remove('has-image'); 
            document.getElementById(`btnRemove${num}`).classList.add('hidden'); 
            finalBlobs[num] = null;
        };

        window.showForm = (isEdit = false) => {
            document.getElementById('listView').classList.add('hidden-view');
            document.getElementById('formView').classList.remove('hidden-view');
            document.getElementById('formTitle').innerText = isEdit ? 'Editar Serviço' : 'Adicionar Novo Serviço';
            if(!isEdit) {
                document.getElementById('productForm').reset();
                document.getElementById('isActive').checked = true;
                document.getElementById('isPromo').checked = false;
                for(let i=1; i<=5; i++) removeImage(i); 
            }
            window.scrollTo(0,0);
        }

        window.showList = () => {
            document.getElementById('formView').classList.add('hidden-view');
            document.getElementById('listView').classList.remove('hidden-view');
        }

        const formatMoney = (val) => val ? `R$ ${parseFloat(val).toFixed(2).replace('.', ',')}` : '-';

        async function loadProducts() {
            const listDiv = document.getElementById('productList');
            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('display_order', { ascending: true });

                if (error) throw error;

                listDiv.innerHTML = '';
                allProducts = products || [];
                
                if(allProducts.length === 0) {
                    listDiv.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Nenhum serviço cadastrado.</td></tr>';
                    return;
                }

                allProducts.forEach((data, index) => {
                    const coverImg = (data.images && data.images.length > 0) ? data.images[0] : 'https://placehold.co/100?text=Sem+Foto';
                    const hasPromo = data.promo_price && parseFloat(data.promo_price) > 0;
                    
                    const isActive = data.is_active !== false;
                    const statusBadge = isActive 
                        ? '<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-bold">Ativo</span>' 
                        : '<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full font-bold">Pausado</span>';
                    
                    const promoBadge = data.is_promo ? '<span class="bg-pink-100 text-pink-700 text-xs px-2.5 py-1 rounded-full font-bold ml-1">Oferta</span>' : '';

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors border-b border-gray-100';
                    tr.innerHTML = `
                        <td class="px-4 py-4 text-center">
                            <div class="flex flex-col items-center gap-1">
                                <button onclick="moveOrder('${data.id}', 'up')" class="text-gray-400 hover:text-gray-700 p-1" title="Mover para cima"><i class="fas fa-chevron-up text-xs"></i></button>
                                <span class="text-xs font-bold text-gray-500">${data.display_order || index}</span>
                                <button onclick="moveOrder('${data.id}', 'down')" class="text-gray-400 hover:text-gray-700 p-1" title="Mover para baixo"><i class="fas fa-chevron-down text-xs"></i></button>
                            </div>
                        </td>
                        <td class="px-6 py-4"><img src="${coverImg}" class="w-14 h-14 object-cover rounded-lg shadow-sm"></td>
                        <td class="px-6 py-4 font-medium text-gray-800">${data.name}<br><span class="text-xs text-gray-400 font-normal">${data.short_desc ? data.short_desc.substring(0,40)+'...' : ''}</span></td>
                        <td class="px-6 py-4 text-gray-600 ${hasPromo ? 'line-through text-xs' : 'font-semibold'}">${formatMoney(data.price)}</td>
                        <td class="px-6 py-4">${statusBadge} ${promoBadge}</td>
                        <td class="px-6 py-4 text-right">
                            <button type="button" onclick="editProduct('${data.id}')" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 px-3 py-1.5 rounded-md mr-1"><i class="fas fa-edit"></i></button>
                            <button type="button" onclick="deleteProduct('${data.id}')" class="text-red-600 hover:text-red-900 bg-red-50 px-3 py-1.5 rounded-md"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    listDiv.appendChild(tr);
                });
            } catch (err) {
                listDiv.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">Erro ao carregar dados.</td></tr>';
                console.error(err);
            }
        }

        // Função para reordenar os itens com as setas
        window.moveOrder = async (id, direction) => {
            const index = allProducts.findIndex(p => p.id === id);
            if (index === -1) return;

            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            if (targetIndex < 0 || targetIndex >= allProducts.length) return;

            const currentItem = allProducts[index];
            const targetItem = allProducts[targetIndex];

            // Troca os valores de display_order
            const tempOrder = currentItem.display_order || index;
            currentItem.display_order = targetItem.display_order || targetIndex;
            targetItem.display_order = tempOrder;

            // Se por acaso tiverem a mesma ordem, força a inversão numérica
            if (currentItem.display_order === targetItem.display_order) {
                currentItem.display_order = direction === 'up' ? targetItem.display_order - 1 : targetItem.display_order + 1;
            }

            try {
                await supabase.from('products').update({ display_order: currentItem.display_order }).eq('id', currentItem.id);
                await supabase.from('products').update({ display_order: targetItem.display_order }).eq('id', targetItem.id);
                loadProducts();
            } catch (err) {
                console.error("Erro ao reordenar:", err);
            }
        };

        async function uploadImageToSupabase(num) {
            const blob = finalBlobs[num];
            const hiddenUrl = document.getElementById(`url${num}`).value;

            if (blob) {
                const fileName = `produto_${Date.now()}_${num}.jpg`;
                const { data, error } = await supabase.storage.from('produtos').upload(fileName, blob, { contentType: 'image/jpeg' });
                if (error) throw error;
                
                const { data: publicUrlData } = supabase.storage.from('produtos').getPublicUrl(fileName);
                return publicUrlData.publicUrl;
            }
            return hiddenUrl;
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Salvando...</span>';
            submitBtn.disabled = true;
            
            const id = document.getElementById('productId').value;
            
            try {
                const img1 = await uploadImageToSupabase(1);
                const img2 = await uploadImageToSupabase(2);
                const img3 = await uploadImageToSupabase(3);
                const img4 = await uploadImageToSupabase(4);
                const img5 = await uploadImageToSupabase(5);

                const imagesArray = [img1, img2, img3, img4, img5].filter(url => url && url.trim() !== "");

                if(imagesArray.length === 0) {
                    alert("A Foto de Capa (Foto 1) é obrigatória.");
                    throw new Error("Sem imagens");
                }

                const productData = { 
                    name: document.getElementById('name').value, 
                    short_desc: document.getElementById('shortDesc').value,
                    full_desc: document.getElementById('fullDesc').value,
                    price: parseFloat(document.getElementById('price').value) || 0,
                    promo_price: parseFloat(document.getElementById('promoPrice').value) || null,
                    is_promo: document.getElementById('isPromo').checked,
                    is_active: document.getElementById('isActive').checked, // Salva se está ativo ou pausado
                    images: imagesArray 
                };

                if(id) {
                    const { error } = await supabase.from('products').update(productData).eq('id', id);
                    if (error) throw error;
                } else {
                    productData.display_order = allProducts.length; // Novo produto vai para o final
                    const { error } = await supabase.from('products').insert([productData]);
                    if (error) throw error;
                }
                
                showList();
                loadProducts();
            } catch (err) {
                alert("Erro ao salvar o produto.");
                console.error(err);
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-save"></i> <span>Salvar Serviço</span>';
                submitBtn.disabled = false;
            }
        });

        window.deleteProduct = async (id) => {
            if(confirm("Excluir permanentemente este serviço?")) {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) alert("Erro ao excluir.");
                loadProducts();
            }
        };

        window.editProduct = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;

            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('shortDesc').value = product.short_desc || '';
            document.getElementById('fullDesc').value = product.full_desc || '';
            document.getElementById('price').value = product.price;
            document.getElementById('promoPrice').value = product.promo_price || '';
            document.getElementById('isPromo').checked = product.is_promo || false;
            document.getElementById('isActive').checked = product.is_active !== false;

            for(let i=1; i<=5; i++) {
                removeImage(i);
                const imgUrl = product.images && product.images[i-1] ? product.images[i-1] : '';
                document.getElementById(`url${i}`).value = imgUrl;
                if(imgUrl) {
                    document.getElementById(`preview${i}`).src = imgUrl;
                    document.getElementById(`box${i}`).classList.add('has-image');
                    document.getElementById(`btnRemove${i}`).classList.remove('hidden');
                }
            }
            showForm(true);
        };

        loadProducts();
    </script>
</body>
</html>
