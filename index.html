<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Marcar Consulta</title>
    <style>
        :root { --primary-accent: #3b82f6; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --border-color: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .navbar { width: 100%; max-width: 600px; background: var(--card-bg); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .logo { width: 40px; height: 40px; background: var(--primary-accent); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;}
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); padding: 30px; }
        .time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 15px; }
        .time-btn { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }
        .time-btn.selected { background: var(--primary-accent); color: white; }
        .btn { background: var(--primary-accent); color: #fff; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 25px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <nav class="navbar"><div class="logo" id="ui-logo">CL</div><h2 id="ui-nome">Carregando...</h2></nav>
    <div class="container">
        <h1>Nova Marcação</h1>
        <label>Procedimento</label>
        <select id="servico"><option>Limpeza de Pele</option><option>Botox</option></select>
        <label>Data</label><input type="date" id="data" onchange="carregarHorarios()">
        <label>Escolha o Horário</label>
        <div class="time-grid" id="horarios"></div>
        <button class="btn" onclick="confirmar()">Confirmar Marcação</button>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = () => {
            let c = JSON.parse(localStorage.getItem('sys_config'));
            if(c){
                document.documentElement.style.setProperty('--primary-accent', c.cor);
                document.getElementById('ui-nome').innerText = c.nome;
                if(c.logo) document.getElementById('ui-logo').innerHTML = `<img src="${c.logo}">`;
            }
        }
        window.carregarHorarios = () => {
            const g = JSON.parse(localStorage.getItem('clinica_grade'));
            const grid = document.getElementById('horarios'); grid.innerHTML = "";
            if(!g) { grid.innerHTML = "Sem horários."; return; }
            let s = parseInt(g.start.split(':')[0])*60, e = parseInt(g.end.split(':')[0])*60, i = parseInt(g.int);
            for(let m=s; m<e; m+=i){
                let h = Math.floor(m/60).toString().padStart(2,'0')+":"+(m%60).toString().padStart(2,'0');
                grid.innerHTML += `<div class="time-btn" onclick="selectTime(this, '${h}')">${h}</div>`;
            }
        }
        let selectedH = null;
        window.selectTime = (el, h) => { document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected')); el.classList.add('selected'); selectedH = h; }
        window.confirmar = async () => {
            await addDoc(collection(db, "agendamentos"), { servico: document.getElementById('servico').value, data: document.getElementById('data').value, hora: selectedH, ts: Date.now() });
            alert("Marcação realizada com sucesso!"); location.reload();
        }
    </script>
</body>
</html>
