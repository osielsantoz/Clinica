<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOD Micropigmentação e Estética | Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'yod-bg': '#FCF9F9', 'yod-primary': '#D4A3A3', 'yod-primary-hover': '#C08F8F',
                        'yod-secondary': '#E8D5D5', 'yod-text': '#5A4A4A', 'yod-gold': '#C89F7D',
                    },
                    fontFamily: { sans: ['Lato', 'sans-serif'], serif: ['Playfair Display', 'serif'], },
                    boxShadow: {
                        'delicate': '0 10px 25px -5px rgba(212, 163, 163, 0.15), 0 8px 10px -6px rgba(212, 163, 163, 0.1)',
                        'delicate-hover': '0 20px 25px -5px rgba(212, 163, 163, 0.25), 0 8px 10px -6px rgba(212, 163, 163, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #FCF9F9; }
        ::-webkit-scrollbar-thumb { background: #E8D5D5; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-yod-bg text-yod-text font-sans antialiased overflow-x-hidden">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-yod-secondary/50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col items-center justify-center">
            <h1 class="font-serif text-3xl md:text-4xl text-yod-primary tracking-wider text-center">YOD</h1>
            <p class="text-xs md:text-sm tracking-[0.2em] text-yod-gold uppercase mt-1 text-center">Micropigmentação & Estética</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Promoções -->
        <section class="mb-16">
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-serif text-2xl md:text-3xl text-yod-text relative inline-block">Ofertas Especiais<span class="absolute -bottom-2 left-0 w-12 h-0.5 bg-yod-primary"></span></h2>
                <div class="flex gap-2">
                    <button id="prevPromo" class="w-8 h-8 rounded-full border border-yod-primary text-yod-primary flex items-center justify-center hover:bg-yod-primary hover:text-white transition-colors"><i class="fas fa-chevron-left text-xs"></i></button>
                    <button id="nextPromo" class="w-8 h-8 rounded-full border border-yod-primary text-yod-primary flex items-center justify-center hover:bg-yod-primary hover:text-white transition-colors"><i class="fas fa-chevron-right text-xs"></i></button>
                </div>
            </div>
            <div class="relative w-full overflow-hidden rounded-2xl">
                <div id="promoCarousel" class="flex gap-4 sm:gap-6 overflow-x-auto hide-scroll snap-x snap-mandatory scroll-smooth pb-4 pt-2 px-2"></div>
            </div>
        </section>

        <!-- Serviços -->
        <section>
            <div class="mb-8">
                <h2 class="font-serif text-2xl md:text-3xl text-yod-text relative inline-block">Nossos Serviços e Produtos<span class="absolute -bottom-2 left-0 w-12 h-0.5 bg-yod-primary"></span></h2>
                <p class="mt-4 text-yod-text/80 font-light max-w-2xl">Descubra nossos tratamentos cuidadosamente elaborados para realçar sua beleza natural.</p>
            </div>
            <div id="servicesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8">
                <p class="col-span-full text-center text-yod-text/70 py-10">Carregando serviços...</p>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="serviceModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-yod-text/40 backdrop-blur-sm modal-close"></div>
        <div class="relative bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col md:flex-row fade-in">
            <button class="absolute top-4 right-4 z-10 w-8 h-8 bg-white/80 backdrop-blur rounded-full flex items-center justify-center text-yod-text hover:text-yod-primary shadow-sm modal-close"><i class="fas fa-times"></i></button>
            <div class="w-full md:w-1/2 p-4 sm:p-6 flex flex-col gap-3">
                <div class="w-full aspect-[4/3] rounded-2xl overflow-hidden bg-yod-bg">
                    <img id="modalMainImg" src="" alt="Serviço" class="w-full h-full object-cover">
                </div>
                <div id="modalGallery" class="grid grid-cols-4 gap-2"></div>
            </div>
            <div class="w-full md:w-1/2 p-6 sm:p-8 flex flex-col justify-center bg-yod-bg/30">
                <h3 id="modalTitle" class="font-serif text-2xl md:text-3xl text-yod-text mb-2 leading-tight"></h3>
                <div id="modalPriceContainer" class="mb-6 flex flex-col"></div>
                <div class="prose prose-sm text-yod-text/80 font-light mb-8 flex-grow">
                    <p id="modalDesc" class="leading-relaxed whitespace-pre-wrap"></p>
                </div>
                <a id="modalWhatsAppBtn" href="#" target="_blank" class="group relative w-full flex items-center justify-center gap-3 bg-[#25D366] hover:bg-[#1EBE57] text-white py-4 px-6 rounded-xl transition-colors shadow-md">
                    <i class="fab fa-whatsapp text-xl"></i>
                    <span class="font-bold tracking-wide">Fazer esse procedimento</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Script Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // 🔑 COLOQUE SUAS CREDENCIAIS DO SUPABASE AQUI
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const WHATSAPP_LINK = "https://wa.me/+5591986009455";

        const promotions = [
            { title: "Combo Sobrancelha + Buço", shortDesc: "Design perfeito e pele lisa.", price: "R$ 65,00", category: "Combo Promocional", img: "https://placehold.co/400x400/E8D5D5/5A4A4A?text=Combo", gallery: [], fullDesc: "Um combo especial para realçar seu olhar." },
            { title: "Revitalização Labial 20% OFF", shortDesc: "Lábios corados e hidratados.", price: "R$ 320,00", category: "Oferta", img: "https://placehold.co/400x400/D4A3A3/FFFFFF?text=Lábios", gallery: [], fullDesc: "Procedimento que devolve a cor e contorno natural." }
        ];

        function renderPromotions() {
            const promoCarousel = document.getElementById('promoCarousel');
            promoCarousel.innerHTML = '';
            promotions.forEach(promo => {
                const card = document.createElement('div');
                card.className = "flex-none w-64 h-64 relative rounded-2xl overflow-hidden cursor-pointer group shadow-delicate hover:shadow-delicate-hover transition-all duration-300 snap-center";
                card.onclick = () => openModal(promo);
                card.innerHTML = `
                    <img src="${promo.img}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                    <div class="absolute inset-0 p-5 flex flex-col justify-end">
                        <span class="inline-block px-2 py-1 bg-yod-primary text-white text-[10px] uppercase font-bold tracking-wider rounded-md mb-2 w-max">${promo.category}</span>
                        <h3 class="text-white font-serif text-lg leading-tight mb-1">${promo.title}</h3>
                        <p class="text-white/90 text-sm font-semibold">${promo.price}</p>
                    </div>
                `;
                promoCarousel.appendChild(card);
            });
        }

        const formatMoney = (val) => `R$ ${parseFloat(val).toFixed(2).replace('.', ',')}`;

        async function loadServices() {
            const servicesGrid = document.getElementById('servicesGrid');
            try {
                const { data: products, error } = await supabase.from('products').select('*');
                if (error) throw error;

                servicesGrid.innerHTML = '';
                if (!products || products.length === 0) {
                    servicesGrid.innerHTML = '<p class="col-span-full text-center text-yod-text/70 py-10">Nenhum serviço cadastrado.</p>';
                    return;
                }

                products.forEach(data => {
                    const hasPromo = data.promo_price && parseFloat(data.promo_price) > 0;
                    const finalPriceText = hasPromo ? formatMoney(data.promo_price) : formatMoney(data.price);
                    
                    const service = {
                        title: data.name,
                        shortDesc: data.short_desc || '',
                        fullDesc: data.full_desc || '',
                        priceInfo: { raw: data.price, promo: data.promo_price },
                        img: (data.images && data.images.length > 0) ? data.images[0] : 'https://placehold.co/600x400/E8D5D5/5A4A4A?text=Sem+Foto',
                        gallery: data.images || []
                    };

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl overflow-hidden shadow-delicate hover:shadow-delicate-hover transition-all duration-300 cursor-pointer flex flex-col group translate-y-0 hover:-translate-y-1";
                    card.onclick = () => openModal(service);
                    
                    card.innerHTML = `
                        <div class="relative w-full h-52 overflow-hidden bg-yod-bg">
                            <img src="${service.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                            ${hasPromo ? '<div class="absolute top-3 right-3 bg-green-500 text-white px-3 py-1 text-xs font-bold rounded-full shadow-sm">PROMOÇÃO</div>' : ''}
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="font-serif text-xl text-yod-text mb-2">${service.title}</h3>
                            <p class="text-yod-text/70 text-sm font-light mb-4 flex-grow">${service.shortDesc}</p>
                            <div class="flex items-center justify-between mt-auto pt-4 border-t border-yod-secondary/30">
                                <div class="flex flex-col">
                                    ${hasPromo ? `<span class="text-xs text-gray-400 line-through">${formatMoney(data.price)}</span>` : ''}
                                    <span class="${hasPromo ? 'text-green-600' : 'text-yod-primary'} font-bold text-lg">${finalPriceText}</span>
                                </div>
                                <span class="w-8 h-8 rounded-full bg-yod-secondary/50 flex items-center justify-center text-yod-primary group-hover:bg-yod-primary group-hover:text-white transition-colors">
                                    <i class="fas fa-arrow-right text-sm"></i>
                                </span>
                            </div>
                        </div>
                    `;
                    servicesGrid.appendChild(card);
                });
            } catch (err) {
                servicesGrid.innerHTML = '<p class="col-span-full text-center text-red-500 py-10">Erro ao carregar serviços do Supabase.</p>';
                console.error(err);
            }
        }

        const serviceModal = document.getElementById('serviceModal');
        
        function openModal(item) {
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDesc').innerText = item.fullDesc;
            
            const priceContainer = document.getElementById('modalPriceContainer');
            if(item.priceInfo) {
                const hasPromo = item.priceInfo.promo && parseFloat(item.priceInfo.promo) > 0;
                if(hasPromo) {
                    priceContainer.innerHTML = `<span class="text-sm text-gray-400 line-through">${formatMoney(item.priceInfo.raw)}</span>
                                                <span class="text-2xl font-bold text-green-600">${formatMoney(item.priceInfo.promo)}</span>`;
                } else {
                    priceContainer.innerHTML = `<span class="text-2xl font-bold text-yod-primary">${formatMoney(item.priceInfo.raw)}</span>`;
                }
            } else {
                priceContainer.innerHTML = `<span class="text-2xl font-bold text-yod-primary">${item.price}</span>`;
            }

            const mainImg = document.getElementById('modalMainImg');
            mainImg.src = item.img;
            
            const gallery = document.getElementById('modalGallery');
            gallery.innerHTML = '';
            
            if (item.gallery && item.gallery.length > 0) {
                item.gallery.forEach(imgSrc => {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = "w-full aspect-square rounded-lg overflow-hidden cursor-pointer border-2 border-transparent hover:border-yod-primary opacity-80 hover:opacity-100 transition-all";
                    imgDiv.innerHTML = `<img src="${imgSrc}" class="w-full h-full object-cover">`;
                    imgDiv.onclick = () => { mainImg.src = imgSrc; };
                    gallery.appendChild(imgDiv);
                });
            }

            const priceFinal = item.priceInfo ? (item.priceInfo.promo > 0 ? formatMoney(item.priceInfo.promo) : formatMoney(item.priceInfo.raw)) : item.price;
            const msg = `Olá! Tenho interesse no procedimento: *${item.title}* (${priceFinal}). Poderia me passar mais informações?`;
            document.getElementById('modalWhatsAppBtn').href = `${WHATSAPP_LINK}?text=${encodeURIComponent(msg)}`;

            serviceModal.classList.remove('hidden');
            setTimeout(() => { serviceModal.classList.remove('opacity-0'); serviceModal.classList.add('opacity-100'); }, 10);
            document.body.style.overflow = 'hidden'; 
        }

        document.querySelectorAll('.modal-close').forEach(btn => btn.addEventListener('click', () => {
            serviceModal.classList.remove('opacity-100');
            serviceModal.classList.add('opacity-0');
            setTimeout(() => { serviceModal.classList.add('hidden'); document.body.style.overflow = ''; }, 300);
        }));

        let autoScroll;
        const promoCarousel = document.getElementById('promoCarousel');
        const doScroll = (dir) => { 
            promoCarousel.scrollBy({ left: dir === 'next' ? 280 : -280, behavior: 'smooth' }); 
            if(dir === 'next' && promoCarousel.scrollLeft + promoCarousel.clientWidth >= promoCarousel.scrollWidth - 10) 
                setTimeout(() => promoCarousel.scrollTo({ left: 0, behavior: 'smooth' }), 500);
        };
        document.getElementById('nextPromo').onclick = () => { doScroll('next'); clearInterval(autoScroll); autoScroll = setInterval(()=>doScroll('next'), 4000); };
        document.getElementById('prevPromo').onclick = () => { doScroll('prev'); clearInterval(autoScroll); autoScroll = setInterval(()=>doScroll('next'), 4000); };

        window.addEventListener('DOMContentLoaded', () => {
            renderPromotions();
            loadServices(); 
            autoScroll = setInterval(()=>doScroll('next'), 4000);
        });
    </script>
</body>
</html>
