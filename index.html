<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente - Agendamento Premium</title>
    <style>
        :root { --primary-accent: #3b82f6; --primary-hover: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; --danger: #ef4444; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .navbar { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .navbar-brand { display: flex; align-items: center; gap: 10px; }
        .logo-placeholder { width: 35px; height: 35px; background: var(--primary-accent); border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .navbar h2 { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }
        .btn-logout { background: transparent; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; color: var(--text-main); display: none; }
        .app-container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); border: 1px solid var(--border-color); overflow: hidden; position: relative; }
        .screen { display: none; padding: 35px 30px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .screen-header { margin-bottom: 25px; text-align: center; }
        .screen-header h1 { font-size: 1.6rem; margin-bottom: 8px; font-weight: 800;}
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-main); }
        input, select { width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; background: #f8fafc; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--primary-accent); background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn { background: var(--primary-accent); color: #fff; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-outline { background: transparent; color: var(--text-main); border: 2px dashed var(--border-color); margin-top: 15px; }
        .btn-outline:hover { border-color: var(--primary-accent); color: var(--primary-accent); background: #eff6ff; }
        .btn-back { background: none; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .my-appt-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s; }
        .my-appt-info h4 { font-size: 1.15rem; margin-bottom: 6px; color: var(--text-main); }
        .my-appt-info p { color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 5px;}
        .my-appt-date { font-weight: 800; color: var(--primary-accent); margin-bottom: 8px; display: inline-block; background: #eff6ff; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem;}
        .btn-cancel { background: transparent; color: var(--danger); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 12px; margin-top: 15px; }
        .time-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 10px; text-align: center; cursor: pointer; font-weight: bold; color: var(--text-muted); transition: 0.2s; background: var(--bg-color); font-size: 0.95rem; }
        .time-card.selected { background: var(--primary-accent); color: #fff; border-color: var(--primary-accent); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; animation: fadeInModal 0.2s ease; }
        @keyframes fadeInModal { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 450px; border-radius: 16px; padding: 35px 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); text-align: center; }
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <div class="logo-placeholder">CL</div>
            <h2 id="clinica-nome">Clínica Estética</h2>
        </div>
        <button class="btn-logout" id="btn-sair" onclick="fazerLogout()">Sair da Conta</button>
    </nav>

    <div class="app-container">
        <!-- LOGIN -->
        <div id="screen-login" class="screen active">
            <div class="screen-header"><h1>Bem-vindo(a)!</h1><p>Faça login para acessar o portal.</p></div>
            <form onsubmit="event.preventDefault(); simularLogin();">
                <div class="form-group"><label>CPF</label><input type="text" required></div>
                <div class="form-group"><label>Senha</label><input type="password" required></div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>

        <!-- PAINEL -->
        <div id="screen-dashboard" class="screen">
            <div class="screen-header"><h1 style="text-align: left; font-size: 1.4rem;">Olá 👋</h1></div>
            <div id="lista-agendamentos">
                <p style='text-align:center; color: var(--text-muted); font-style: italic; margin-top: 20px;'>Você não possui horários marcados.</p>
            </div>
            <button class="btn btn-outline" onclick="showScreen('screen-booking')">+ Agendar Novo Procedimento</button>
        </div>

        <!-- AGENDAMENTO -->
        <div id="screen-booking" class="screen">
            <button class="btn-back" onclick="showScreen('screen-dashboard')">← Voltar</button>
            <div class="screen-header"><h1>Novo Agendamento</h1></div>
            <form onsubmit="event.preventDefault(); abrirModalConfirmacao();">
                <div class="form-group">
                    <label>1. Procedimento</label>
                    <select id="select-servico" required><option value="">Selecione...</option><option>Limpeza de Pele</option></select>
                </div>
                <div class="form-group">
                    <label>2. Data</label><input type="date" id="input-data" required onchange="gerarGradeDeHorarios()">
                </div>
                <div class="form-group" id="container-horarios" style="display: none;">
                    <label>3. Horário</label>
                    <div class="time-slots" id="grid-horarios"></div>
                    <input type="hidden" id="horario-selecionado" required>
                </div>
                <button type="submit" class="btn" id="btn-confirmar-agendamento" style="display: none; margin-top: 30px;">Agendar</button>
            </form>
        </div>
    </div>

    <!-- MODAIS -->
    <div id="modal-confirmar" class="modal-overlay">
        <div class="modal-box">
            <h2>Confirmar Reserva</h2>
            <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: left; margin-bottom: 25px;">
                <p><strong>Procedimento:</strong> <br><span id="conf-servico"></span></p>
                <p><strong>Data/Hora:</strong> <br><span id="conf-datahora" style="color: var(--primary-accent); font-weight: bold;"></span></p>
            </div>
            <div class="modal-actions"><button class="btn btn-outline" onclick="fecharModais()">Voltar</button><button class="btn" onclick="finalizarAgendamento()">Confirmar</button></div>
        </div>
    </div>

    <div id="modal-cancelar" class="modal-overlay">
        <div class="modal-box">
            <h2 style="color: var(--danger)">Cancelar Consulta?</h2>
            <div class="modal-actions"><button class="btn btn-outline" onclick="fecharModais()">Manter</button><button class="btn danger" onclick="executarCancelamento()">Cancelar</button></div>
        </div>
    </div>

    <div id="modal-sucesso" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 3.5rem; margin-bottom: 15px;">✨</div><h2 id="sucesso-titulo">Sucesso!</h2><p id="sucesso-msg">Concluído.</p>
            <button class="btn" onclick="fecharModais()">Entendi</button>
        </div>
    </div>

    <script>
        function showScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(screenId).classList.add('active'); }
        function simularLogin() { document.getElementById('btn-sair').style.display = 'block'; showScreen('screen-dashboard'); }
        function fazerLogout() { document.getElementById('btn-sair').style.display = 'none'; showScreen('screen-login'); }
        function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
        function mostrarSucesso(msg) { fecharModais(); document.getElementById('sucesso-msg').innerText = msg; document.getElementById('modal-sucesso').classList.add('active'); }

        let cardParaCancelar = null;
        function abrirModalCancelar(cardId) { cardParaCancelar = cardId; document.getElementById('modal-cancelar').classList.add('active'); }
        function executarCancelamento() {
            if(cardParaCancelar) {
                document.getElementById(cardParaCancelar).remove();
                if(document.getElementById('lista-agendamentos').children.length === 0) {
                    document.getElementById('lista-agendamentos').innerHTML = "<p style='text-align:center; color: var(--text-muted); font-style: italic; margin-top: 20px;'>Você não possui horários marcados.</p>";
                }
            }
            mostrarSucesso("Seu agendamento foi cancelado.");
        }

        function gerarGradeDeHorarios() {
            const data = document.getElementById('input-data').value;
            const grid = document.getElementById('grid-horarios');
            grid.innerHTML = ''; document.getElementById('horario-selecionado').value = ''; document.getElementById('btn-confirmar-agendamento').style.display = 'none';
            if(!data) { document.getElementById('container-horarios').style.display = 'none'; return; }
            document.getElementById('container-horarios').style.display = 'block';

            // ZERADO: Gera os horários sem nenhum bloqueio forçado
            for(let i = 8; i < 18; i++) {
                let hora = i.toString().padStart(2, '0') + ":00";
                let div = document.createElement('div');
                div.className = 'time-card'; div.innerText = hora;
                div.onclick = function() { selecionarHorario(this, hora); };
                grid.appendChild(div);
            }
        }

        function selecionarHorario(elemento, hora) {
            document.querySelectorAll('.time-card').forEach(el => el.classList.remove('selected'));
            elemento.classList.add('selected');
            document.getElementById('horario-selecionado').value = hora;
            document.getElementById('btn-confirmar-agendamento').style.display = 'flex';
        }

        function abrirModalConfirmacao() {
            document.getElementById('conf-servico').innerText = document.getElementById('select-servico').value;
            document.getElementById('conf-datahora').innerText = `🗓️ ${document.getElementById('input-data').value.split('-').reverse().join('/')} às 🕒 ${document.getElementById('horario-selecionado').value}`;
            document.getElementById('modal-confirmar').classList.add('active');
        }

        function finalizarAgendamento() {
            const servico = document.getElementById('select-servico').value;
            const data = document.getElementById('input-data').value.split('-').reverse().join('/');
            const hora = document.getElementById('horario-selecionado').value;
            const lista = document.getElementById('lista-agendamentos');
            
            if(lista.innerHTML.includes("Você não possui")) lista.innerHTML = '';

            const newId = 'appt-' + Date.now();
            lista.insertAdjacentHTML('afterbegin', `<div class="my-appt-card" id="${newId}"><div class="my-appt-info"><span class="my-appt-date">🗓️ ${data} - ${hora}</span><h4>${servico}</h4></div><button class="btn-cancel" onclick="abrirModalCancelar('${newId}')">Cancelar</button></div>`);

            document.getElementById('select-servico').value = ''; document.getElementById('input-data').value = '';
            document.getElementById('container-horarios').style.display = 'none'; document.getElementById('btn-confirmar-agendamento').style.display = 'none';
            mostrarSucesso("Agendamento confirmado com sucesso!");
            showScreen('screen-dashboard');
        }
    </script>
</body>
</html>
