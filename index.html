<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yod - Agendamento</title>
    <style>
        :root { --primary-accent: #4f46e5; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --border-color: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); padding: 20px; display: flex; flex-direction: column; align-items: center; color: var(--text-main);}
        .navbar { width: 100%; max-width: 500px; background: var(--card-bg); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;}
        .logo { width: 40px; height: 40px; background: var(--primary-accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; overflow: hidden;}
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); padding: 30px; }
        .screen { display: none; } .screen.active { display: block; }
        .time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .time-btn { padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }
        .time-btn.selected { background: var(--primary-accent); color: white; }
        .btn { background: var(--primary-accent); color: #fff; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; }
        input, select { width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .btn-link { background: none; border: none; color: var(--primary-accent); font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:10px;"><div class="logo" id="ui-logo">Y</div><h2 id="ui-nome" style="font-size:1rem;">Yod</h2></div>
        <button id="btn-sair" style="display:none; color:red; border:none; background:none; font-weight:bold; cursor:pointer;" onclick="sairApp()">Sair</button>
    </nav>

    <div class="container">
        <div id="tela-login" class="screen active">
            <h1>Acesse sua conta</h1>
            <input type="email" id="log-email" placeholder="Seu E-mail">
            <input type="password" id="log-senha" placeholder="Sua Senha">
            <button class="btn" onclick="fazerLogin()">Entrar</button>
            <button class="btn-link" onclick="alternarTela('tela-cadastro')">Criar uma conta gratuita</button>
        </div>

        <div id="tela-cadastro" class="screen">
            <h1>Crie seu perfil</h1>
            <input type="text" id="cad-nome" placeholder="Seu Nome Completo">
            <input type="tel" id="cad-whatsapp" placeholder="WhatsApp com DDD">
            <input type="email" id="cad-email" placeholder="E-mail">
            <input type="password" id="cad-senha" placeholder="Senha (mín. 6 dígitos)">
            <button class="btn" onclick="fazerCadastro()">Criar e Acessar</button>
            <button class="btn-link" onclick="alternarTela('tela-login')">Já tenho conta</button>
        </div>

        <div id="tela-agendar" class="screen">
            <h1>Agendar horário</h1>
            <select id="servico"><option value="">Carregando serviços...</option></select>
            <input type="date" id="data" onchange="gerarHorarios()">
            <div id="aviso-data" style="color:red; font-size:0.8rem; margin-top:10px;"></div>
            <div id="box-horarios" style="display:none;">
                <div class="time-grid" id="horarios"></div>
                <button class="btn" onclick="confirmarAgendamento()">Finalizar Marcação</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDoc, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

        let userLogado = null, configG = null, selectedH = null;

        onAuthStateChanged(auth, (u) => { 
            if(u) { userLogado=u; document.getElementById('btn-sair').style.display='block'; alternarTela('tela-agendar'); carregarYod(); } 
            else { alternarTela('tela-login'); document.getElementById('btn-sair').style.display='none'; }
        });

        window.fazerLogin = () => signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-senha').value).catch(e => alert("Erro no login."));
        window.fazerCadastro = async () => {
            const n = document.getElementById('cad-nome').value, w = document.getElementById('cad-whatsapp').value, e = document.getElementById('cad-email').value, s = document.getElementById('cad-senha').value;
            try { const c = await createUserWithEmailAndPassword(auth, e, s); await updateProfile(c.user, {displayName: n}); await setDoc(doc(db, "usuarios", c.user.uid), { nome: n, whatsapp: w }); } catch(err){ alert("Erro no cadastro."); }
        }
        window.sairApp = () => signOut(auth);
        window.alternarTela = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

        async function carregarYod() {
            const gSnap = await getDoc(doc(db, "configuracoes", "geral"));
            if(gSnap.exists()){ document.documentElement.style.setProperty('--primary-accent', gSnap.data().cor); document.getElementById('ui-nome').innerText = gSnap.data().nome; if(gSnap.data().logo) document.getElementById('ui-logo').innerHTML = `<img src="${gSnap.data().logo}">`; }
            const grSnap = await getDoc(doc(db, "configuracoes", "grade")); if(grSnap.exists()) configG = grSnap.data();
            onSnapshot(collection(db, "procedimentos"), (s) => { const sel = document.getElementById('servico'); sel.innerHTML="<option value=''>Escolha o serviço...</option>"; s.forEach(d => sel.innerHTML+=`<option value="${d.data().nome}|${d.data().valor}">${d.data().nome} - R$ ${d.data().valor.toFixed(2)}</option>`); });
        }

        window.gerarHorarios = () => {
            const data = document.getElementById('data').value, grid = document.getElementById('horarios'), box = document.getElementById('box-horarios'), aviso = document.getElementById('aviso-data');
            box.style.display='none'; grid.innerHTML=''; aviso.innerText=''; if(!data || !configG) return;
            const dia = new Date(data + "T00:00:00").getDay();
            if(!configG.dias.includes(dia)){ aviso.innerText="Yod fechada neste dia. Escolha outro."; return; }
            box.style.display='block'; let s=parseInt(configG.start.split(':')[0])*60, e=parseInt(configG.end.split(':')[0])*60, i=parseInt(configG.int);
            for(let m=s; m<e; m+=i){ let h = Math.floor(m/60).toString().padStart(2,'0')+":"+(m%60).toString().padStart(2,'0'); grid.innerHTML += `<div class="time-btn" onclick="selT(this, '${h}')">${h}</div>`; }
        }
        window.selT = (el, h) => { document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected')); el.classList.add('selected'); selectedH=h; }

        window.confirmarAgendamento = async () => {
            const v = document.getElementById('servico').value, d = document.getElementById('data').value;
            if(!v || !d || !selectedH) return alert("Preencha tudo.");
            const uDoc = await getDoc(doc(db, "usuarios", userLogado.uid));
            await addDoc(collection(db, "agendamentos"), { pacienteNome: userLogado.displayName, pacienteWhatsapp: uDoc.data().whatsapp, servico: v.split('|')[0], valor: parseFloat(v.split('|')[1]), data: d.split('-').reverse().join('/'), hora: selectedH, ts: Date.now() });
            alert("Agendamento na Yod realizado!"); location.reload();
        }
    </script>
</body>
</html>
