<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yod Micropigmentação e Estética - Agendamento</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1f2937; --text-light: #6b7280; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; color: var(--text); min-height: 100vh; }
        
        /* Navbar */
        .navbar { width: 100%; max-width: 480px; background: var(--card); padding: 16px 24px; border-radius: 14px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01), 0 2px 4px -1px rgba(0,0,0,0.01); }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo { width: 42px; height: 42px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; overflow: hidden; font-size: 1.3rem;}
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .clinic-title { font-size: 1.1rem; font-weight: 700; color: #111827; }
        .btn-sair { color: var(--danger); border: none; background: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; display: none; transition: 0.2s; }
        .btn-sair:hover { opacity: 0.7; }
        
        /* Container do App */
        .container { width: 100%; max-width: 480px; background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 35px 25px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); }
        .screen { display: none; animation: slideUp 0.3s ease-out; } 
        .screen.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Tipografia */
        h1 { font-size: 1.6rem; font-weight: 800; color: #111827; margin-bottom: 8px; text-align: center; }
        .welcome-user { text-align: left; font-size: 1.4rem; font-weight: 800; color: #111827; margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-light); font-size: 0.95rem; margin-bottom: 25px; }
        
        /* Formulários */
        label { display: block; font-weight: 600; margin-top: 18px; margin-bottom: 8px; font-size: 0.9rem; color: #374151; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); outline: none; background: #f9fafb; font-size: 1rem; transition: 0.2s;}
        input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08); }
        
        /* Botões */
        .btn { background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 1rem; transition: 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);}
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-link { background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; margin-top: 20px; width: 100%; font-size: 0.95rem; text-align: center; display: block;}
        
        /* Grade de Horários Clicáveis */
        .grid-horarios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
        .btn-hora { padding: 14px 10px; border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; font-weight: bold; color: var(--text); transition: 0.2s; text-align: center; font-size: 0.95rem; }
        .btn-hora:hover { border-color: var(--primary); background: #f5f3ff; }
        .btn-hora.selected { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25); }
        
        .erro { color: var(--danger); font-size: 0.9rem; text-align: center; margin-top: 15px; font-weight: 600; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR MUDANDO DE DESIGN AUTOMÁTICO -->
    <nav class="navbar">
        <div class="brand">
            <div class="logo" id="ui-logo">Y</div>
            <h2 id="ui-nome" class="clinic-title">Yod Micropigmentação e Estética</h2>
        </div>
        <button id="btn-sair">Sair</button>
    </nav>

    <div class="container">
        
        <!-- TELA 1: LOGIN -->
        <div id="t-login" class="screen active">
            <h1>Acesso ao Portal</h1>
            <p class="subtitle">Faça login para realizar seu agendamento.</p>
            <input type="email" id="l-email" placeholder="Seu E-mail">
            <input type="password" id="l-senha" placeholder="Sua Senha" style="margin-top: 12px;">
            <button class="btn" id="btn-entrar-action">Entrar</button>
            <button class="btn-link" id="btn-ir-cadastro">Quero criar uma conta gratuita</button>
            <div id="erro-l" class="erro"></div>
        </div>

        <!-- TELA 2: CADASTRO -->
        <div id="t-cad" class="screen">
            <h1>Criar Perfil de Paciente</h1>
            <p class="subtitle">Cadastre-se rapidamente na plataforma.</p>
            <input type="text" id="c-nome" placeholder="Nome Completo">
            <input type="tel" id="c-wpp" placeholder="WhatsApp (com DDD)" style="margin-top: 12px;">
            <input type="email" id="c-email" placeholder="E-mail" style="margin-top: 12px;">
            <input type="password" id="c-senha" placeholder="Crie uma Senha (mín. 6 dígitos)" style="margin-top: 12px;">
            <button class="btn" id="btn-cadastrar-action">Concluir Cadastro</button>
            <button class="btn-link" id="btn-ir-login">Já possuo uma conta</button>
            <div id="erro-c" class="erro"></div>
        </div>

        <!-- TELA 3: FORMULÁRIO DE AGENDAMENTO DEPOIS DE LOGADO -->
        <div id="t-agenda" class="screen">
            <!-- Saudação Dinâmica com o Nome do Cliente -->
            <div class="welcome-user" id="user-greeting">Olá! 👋</div>
            <p style="color: var(--text-light); font-size: 0.95rem; margin-bottom: 25px;">Agende o seu procedimento de forma rápida abaixo.</p>
            
            <label>1. Escolha o Procedimento Estético</label>
            <select id="servico"><option value="">Carregando procedimentos disponíveis...</option></select>
            
            <label>2. Escolha o Dia de Atendimento</label>
            <input type="date" id="data">
            <div id="aviso-data" class="erro" style="text-align: left; margin-top: 6px; font-size: 0.85rem;"></div>
            
            <!-- GRADE DIÁRIA MUDANDO CONFORME CONFIGURAÇÃO DO PAINEL -->
            <div id="area-horarios" style="display:none; margin-top: 10px;">
                <label>3. Escolha o Horário Disponível</label>
                <div class="grid-horarios" id="grid-h"></div>
                <button class="btn" id="btn-finalizar-marca">Confirmar e Agendar Horário</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDoc, doc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // CONFIGURAÇÃO OFICIAL DA NUVEM (FIREBASE)
        const firebaseConfig = { apiKey: "AIzaSyD4SElQHlfQjbN2NsHC0Z9_1Gobb6WHd8o", authDomain: "clinicabase-a85a7.firebaseapp.com", projectId: "clinicabase-a85a7", storageBucket: "clinicabase-a85a7.firebasestorage.app", messagingSenderId: "324071825277", appId: "1:324071825277:web:6a0d3c4413f7a7569fb614" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

        let pacienteLogado = null;
        let gradeParametros = null;
        let bloqueiosPorDatas = {};
        let agendamentosExistentes = [];
        let horaSelecionada = null;

        // Gerenciador de Estado de Login
        onAuthStateChanged(auth, (user) => { 
            if(user) { 
                pacienteLogado = user; 
                document.getElementById('btn-sair').style.display = 'block';
                // Coloca o nome do cliente logado em destaque na saudação
                document.getElementById('user-greeting').innerText = `Olá, ${user.displayName || 'Paciente'}! 👋`;
                mudarTela('t-agenda'); 
                conectarBancoDados(); 
            } else { 
                pacienteLogado = null; 
                document.getElementById('btn-sair').style.display = 'none';
                mudarTela('t-login'); 
            }
        });

        // Eventos de Cliques de Botão (Resolvendo problemas de escopo de Módulo JS)
        document.getElementById('btn-entrar-action').addEventListener('click', () => {
            const e = document.getElementById('l-email').value, s = document.getElementById('l-senha').value;
            signInWithEmailAndPassword(auth, e, s).catch(() => document.getElementById('erro-l').innerText = "E-mail ou senha incorretos.");
        });

        document.getElementById('btn-cadastrar-action').addEventListener('click', async () => {
            const n = document.getElementById('c-nome').value, w = document.getElementById('c-wpp').value;
            const e = document.getElementById('c-email').value, s = document.getElementById('c-senha').value;
            if(!n || !w) return document.getElementById('erro-c').innerText = "Preencha o seu nome completo e o WhatsApp.";
            try { 
                const cr = await createUserWithEmailAndPassword(auth, e, s); 
                await updateProfile(cr.user, { displayName: n }); 
                await setDoc(doc(db, "usuarios", cr.user.uid), { nome: n, whatsapp: w }); 
            } catch(err) { 
                document.getElementById('erro-c').innerText = "Erro ao criar perfil. Use uma senha de no mínimo 6 caracteres."; 
            }
        });

        document.getElementById('btn-sair').addEventListener('click', () => signOut(auth));
        document.getElementById('btn-ir-cadastro').addEventListener('click', () => mudarTela('t-cad'));
        document.getElementById('btn-ir-login').addEventListener('click', () => mudarTela('t-login'));
        document.getElementById('btn-finalizar-marca').addEventListener('click', () => submeterAgendamento());
        document.getElementById('data').addEventListener('change', () => escutarMudancaDataCalendario());

        function mudarTela(id) { 
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
        }

        async function conectarBancoDados() {
            // Sincroniza Cores e Marca da Yod Micropigmentação
            const geralSnap = await getDoc(doc(db, "configuracoes", "geral"));
            if(geralSnap.exists()) {
                const c = geralSnap.data();
                document.documentElement.style.setProperty('--primary', c.cor);
                document.getElementById('ui-nome').innerText = c.nome;
                if(c.logo) document.getElementById('ui-logo').innerHTML = `<img src="${c.logo}">`;
            }

            // Sincroniza Regra de Horários do Painel
            const gradeSnap = await getDoc(doc(db, "configuracoes", "parametros_grade"));
            if(gradeSnap.exists()) gradeParametros = gradeSnap.data();

            // Sincroniza Aba de Bloqueios Específicos do Painel
            onSnapshot(doc(db, "configuracoes", "bloqueios_datas"), (snap) => {
                if(snap.exists()) bloqueiosPorDatas = snap.data();
                escutarMudancaDataCalendario(); // Recarrega os horários se houver bloqueio ao vivo
            });

            // Sincroniza Serviços Cadastrados Pro Dropdown
            onSnapshot(collection(db, "procedimentos"), (snap) => {
                const select = document.getElementById('servico');
                select.innerHTML = "<option value=''>Clique para selecionar o procedimento...</option>";
                snap.forEach(d => {
                    const p = d.data();
                    select.innerHTML += `<option value="${p.nome}|${p.valor}">${p.nome} - R$ ${p.valor.toFixed(2)}</option>`;
                });
            });

            // Sincroniza Ocupação Geral para Bloquear Batida de Horário
            onSnapshot(collection(db, "agendamentos"), (snap) => {
                agendamentosExistentes = [];
                snap.forEach(d => agendamentosExistentes.push(d.data()));
                escutarMudancaDataCalendario();
            });
        }

        // Gera a Grade Dinâmica Conforme Escolha do Dia
        function escutarMudancaDataCalendario() {
            const dataInput = document.getElementById('data').value;
            const grid = document.getElementById('grid-h');
            const box = document.getElementById('area-horarios');
            const aviso = document.getElementById('aviso-data');
            
            box.style.display = 'none'; grid.innerHTML = ''; aviso.innerText = ''; horaSelecionada = null;
            if(!dataInput || !gradeParametros) return;

            const dataBr = dataInput.split('-').reverse().join('/');
            
            box.style.display = 'block';
            let startM = parseInt(gradeParametros.start.split(':')[0])*60;
            let endM = parseInt(gradeParametros.end.split(':')[0])*60;
            let interv = parseInt(gradeParametros.int);
            
            // Puxa bloqueios específicos daquela data no painel
            let bloqueadosDoDia = bloqueiosPorDatas[dataBr] || [];
            let criados = 0;

            for(let m = startM; m < endM; m += interv) {
                let h = Math.floor(m/60).toString().padStart(2,'0')+":"+(m%60).toString().padStart(2,'0');
                
                // 1. O horário não pode estar bloqueado (Vermelho no Painel)
                if(!bloqueadosDoDia.includes(h)) {
                    // 2. O horário não pode estar ocupado por outro cliente
                    let ocupado = agendamentosExistentes.some(a => a.data === dataBr && a.hora === h);
                    
                    if(!ocupado) {
                        grid.innerHTML += `<div class="btn-hora" id="hr-slot-${h.replace(':','')}">${h}</div>`;
                        criados++;
                    }
                }
            }

            // Atribui evento de clique para os horários gerados
            for(let m = startM; m < endM; m += interv) {
                let h = Math.floor(m/60).toString().padStart(2,'0')+":"+(m%60).toString().padStart(2,'0');
                const btn = document.getElementById(`hr-slot-${h.replace(':','')}`);
                if(btn) {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.btn-hora').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        horaSelecionada = h;
                    });
                }
            }

            if(criados === 0) {
                box.style.display = 'none';
                aviso.innerText = "Não há horários de atendimento livres para esta data. Selecione outro dia.";
            }
        }

        // Submete a Escolha pra Nuvem
        async function submeterAgendamento() {
            const pVal = document.getElementById('servico').value;
            const dVal = document.getElementById('data').value;
            if(!pVal || !dVal || !horaSelecionada) return alert("Por favor, selecione o procedimento, a data e o horário desejado.");

            // Puxa o WhatsApp que o cliente salvou no cadastro
            const uSnap = await getDoc(doc(db, "usuarios", pacienteLogado.uid));
            let wpp = ""; if(uSnap.exists()) wpp = uSnap.data().whatsapp;

            const servNome = pVal.split('|')[0];
            const servValor = parseFloat(pVal.split('|')[1]);
            const dataBr = dVal.split('-').reverse().join('/');

            await addDoc(collection(db, "agendamentos"), {
                pacienteNome: pacienteLogado.displayName || "Paciente Web",
                pacienteWhatsapp: wpp,
                servico: servNome,
                valor: servValor,
                data: dataBr,
                hora: horaSelecionada,
                ts: Date.now()
            });

            alert("✨ Perfeito! Seu agendamento na Yod foi confirmado e já está na tela da nossa recepção!");
            location.reload();
        }
    </script>
</body>
</html>
